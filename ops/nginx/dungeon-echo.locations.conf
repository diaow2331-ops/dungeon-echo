# Dungeon Echo v1 static route. Include inside the play.91hwl.cn HTTPS server block.
# Replace __DUNGEON_ECHO_RELEASE_DIR__ with an immutable staged release path,
# such as /srv/dungeon-echo/releases/0123456789ab. Never alias through `current`.

location = /dungeon-echo {
    return 308 /dungeon-echo/;
}

location ^~ /dungeon-echo/ {
    alias __DUNGEON_ECHO_RELEASE_DIR__/;
    index index.html;
    autoindex off;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'none'" always;
}
