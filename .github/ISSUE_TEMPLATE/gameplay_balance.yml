name: Gameplay / balance feedback
description: Report a player-experience problem, class imbalance or build/economy issue
title: "[Gameplay] "
body:
  - type: markdown
    attributes:
      value: |
        Dungeon Echo balances around real player decisions, not identical bot win rates. Please describe the decision or play pattern that feels broken, repetitive or unclear.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Combat rules
        - Warrior
        - Ranger
        - Arcanist
        - Assassin
        - Equipment / affixes
        - Talents / progression
        - Boss / enemy behavior
        - Town / economy
        - Greedy Expedition risk/reward
        - Art / UI readability
        - Other
    validations:
      required: true
  - type: input
    id: floor
    attributes:
      label: Approximate floor range
      placeholder: "1-10, 30-40, 70+, etc."
    validations:
      required: true
  - type: input
    id: class
    attributes:
      label: Class / build
      placeholder: "Warrior, retaliation/sustain; Ranger crit/kite..."
  - type: textarea
    id: behavior
    attributes:
      label: What player behavior does the current system encourage?
      placeholder: "Example: this guardian's safest answer is to repeat one low-risk positioning pattern, so the encounter stops creating meaningful decisions."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Why is that behavior a problem?
      description: Focus on choices, risk, resource pressure, repetition, readability or lack of counterplay rather than only a win/loss result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Play evidence
      description: Optional but useful — damage taken, potion usage, repeated scenario, seed, equipment assumptions, screenshot/recording, etc.
  - type: textarea
    id: direction
    attributes:
      label: Suggested direction (optional)
      description: Describe the intended player-facing outcome. Exact numeric values are not required.
