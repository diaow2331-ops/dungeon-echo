name: content-authority-cutover-once-v130

on:
  push:
    branches:
      - refactor/content-authority-cutover-v130

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preflight atomic content authority transfer
        run: node ops/content-authority-cutover-v130.cjs --check
      - name: Apply atomic content authority transfer
        run: node ops/content-authority-cutover-v130.cjs --apply
      - name: Verify repository authority gate
        run: bash ops/check-authority-local.sh
      - name: Commit cutover and remove one-shot executor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/content-authority-cutover-once-v130.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No cutover changes produced" >&2; exit 1; }
          git commit -m "refactor: transfer content classification authority"
          git push origin HEAD:refactor/content-authority-cutover-v130
