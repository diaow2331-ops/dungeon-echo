name: recover-class-combat-fx-v131-once
on:
  push:
    branches: ["feature/recover-class-combat-fx-v131"]
    paths: [".github/workflows/recover-class-combat-fx-v131-once.yml"]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-class-combat-fx-v131
          fetch-depth: 0
      - name: Apply single-renderer combat FX recovery
        shell: bash
        run: |
          set -euo pipefail
          python -B <<'PY'
          from pathlib import Path
          p=Path('game/core/game.js')
          s=p.read_text()
          old="""function lunge(ent, tx, ty) {
            ent.lungeT = 1; ent.ldx = Math.sign(tx - ent.x); ent.ldy = Math.sign(ty - ent.y);
          }
          """
          new=old+"""let classSkillFxT = 0;
          const CLASS_COMBAT_FX_STYLE = Object.freeze({
            warrior:{ main:'#eca548', soft:'#ffd585' },
            ranger:{ main:'#68d284', soft:'#b5f2b6' },
            mage:{ main:'#6fa4ff', soft:'#becbff' },
            assassin:{ main:'#bb70eb', soft:'#f49bdb' },
          });
          """
          if s.count(old)!=1: raise SystemExit('lunge anchor mismatch')
          s=s.replace(old,new,1)
          old2="""  if (!used) return;
          const echo = mechanicPower('echo_edge');
          """
          new2="""  if (!used) return;
          classSkillFxT = 1;
          const echo = mechanicPower('echo_edge');
          """
          if s.count(old2)!=1: raise SystemExit('skill anchor mismatch')
          s=s.replace(old2,new2,1)
          old3="""function drawShadow(px, py, rx, ry) {
          """
          fx=r"""function drawClassCombatFx(now) {
            if (!player) return;
            const attack = clamp(Number(player.lungeT) || 0, 0, 1);
            const skill = clamp(classSkillFxT, 0, 1);
            if (attack <= .01 && skill <= .01) return;
            const style = CLASS_COMBAT_FX_STYLE[classId] || CLASS_COMBAT_FX_STYLE.warrior;
            const facing = Array.isArray(player.facing) ? player.facing : [1, 0];
            let dx = Number(facing[0]) || 0, dy = Number(facing[1]) || 0;
            if (!dx && !dy) dx = 1;
            const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
            const [lox, loy] = lungeOff(player);
            const bob = Math.sin(now * 2.6 + player.x * 7 + player.y * 5) * 1.3;
            const cx = player.fx * TILE + TILE / 2 + lox;
            const cy = player.fy * TILE + TILE / 2 + bob + loy - 3;
            const angle = Math.atan2(dy, dx);
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (classId === 'warrior') {
              ctx.strokeStyle = skill > .01 ? style.soft : style.main;
              ctx.globalAlpha = .35 + Math.max(attack, skill) * .5;
              ctx.lineWidth = 2 + Math.max(attack, skill) * 2;
              ctx.beginPath();
              ctx.arc(0, 0, 22 + skill * 10 + attack * 6, -.82, .82);
              ctx.stroke();
            } else if (classId === 'ranger') {
              ctx.strokeStyle = style.main;
              ctx.globalAlpha = .35 + Math.max(attack, skill) * .45;
              for (let i = skill > .01 ? -1 : 0; i <= (skill > .01 ? 1 : 0); i++) {
                ctx.lineWidth = i === 0 ? 2 : 1;
                ctx.beginPath(); ctx.moveTo(8, i * 6); ctx.lineTo(30 + skill * 18 + attack * 8, i * 3); ctx.stroke();
              }
            } else if (classId === 'mage') {
              ctx.strokeStyle = style.main;
              ctx.fillStyle = style.soft;
              ctx.globalAlpha = .35 + Math.max(attack, skill) * .45;
              ctx.lineWidth = 1.5 + skill;
              ctx.beginPath(); ctx.arc(18 + attack * 7, 0, 5 + attack * 4, 0, Math.PI * 2); ctx.fill();
              if (skill > .01) {
                ctx.beginPath(); ctx.arc(0, 0, 20 + (1 - skill) * 8, 0, Math.PI * 2); ctx.stroke();
                ctx.rotate(Math.PI / 4); ctx.strokeRect(-10, -10, 20, 20);
              }
            } else {
              ctx.strokeStyle = style.soft;
              ctx.globalAlpha = .35 + Math.max(attack, skill) * .5;
              ctx.lineWidth = 1.8;
              const reach = 20 + attack * 9 + skill * 8;
              ctx.beginPath(); ctx.moveTo(-7, -12); ctx.lineTo(reach, 9); ctx.moveTo(-5, 11); ctx.lineTo(reach - 2, -8); ctx.stroke();
              if (skill > .01) {
                ctx.strokeStyle = style.main; ctx.globalAlpha *= .55;
                ctx.beginPath(); ctx.moveTo(-18 - (1-skill)*12, -9); ctx.lineTo(8, 0); ctx.moveTo(-24 - (1-skill)*9, 8); ctx.lineTo(5, 1); ctx.stroke();
              }
            }
            ctx.restore();
          }
          
          """
          if s.count(old3)!=1: raise SystemExit('drawShadow anchor mismatch')
          s=s.replace(old3,fx+old3,1)
          old4="""  drawEquippedHero(now);

          ctx.strokeStyle = '#f2e3ad';
          """
          new4="""  drawEquippedHero(now);
          drawClassCombatFx(now);

          ctx.strokeStyle = '#f2e3ad';
          """
          if s.count(old4)!=1: raise SystemExit('hero draw anchor mismatch')
          s=s.replace(old4,new4,1)
          old5="""    if (e.lungeT > 0) e.lungeT = Math.max(0, e.lungeT - dt * 5);
            if (e.hurtT > 0) e.hurtT = Math.max(0, e.hurtT - dt * 4);
          };
          """
          new5=old5+"""  if (classSkillFxT > 0) classSkillFxT = Math.max(0, classSkillFxT - dt * (reducedMotion ? 4 : 2.2));
          """
          if s.count(old5)!=1: raise SystemExit('visual decay anchor mismatch')
          s=s.replace(old5,new5,1)
          p.write_text(s)
          PY
          cat > test/class-combat-fx-authority-v131.cjs <<'EOF'
          'use strict';
          const fs=require('fs'),path=require('path');
          const root=process.env.DE_ROOT||path.resolve(__dirname,'..');
          const core=fs.readFileSync(path.join(root,'game/core/game.js'),'utf8');
          const runtime=fs.readFileSync(path.join(root,'game/core/runtime-bootstrap.js'),'utf8');
          let pass=0,fail=0;const ok=(c,n)=>{if(c){pass++;console.log('  PASS '+n)}else{fail++;console.log('  FAIL '+n)}};
          ok(core.includes('function drawClassCombatFx(now)'),'canonical core renderer owns recovered class FX');
          ok(core.includes('classSkillFxT = 1;'),'skill resolution emits presentation timer inside core');
          ok(core.includes('drawEquippedHero(now);\n  drawClassCombatFx(now);'),'class FX renders in the existing Canvas pass');
          ok(core.includes("warrior:{ main:'#eca548'")&&core.includes("ranger:{ main:'#68d284'")&&core.includes("mage:{ main:'#6fa4ff'")&&core.includes("assassin:{ main:'#bb70eb'"),'all four class visual languages are present');
          ok(!core.includes('de-class-combat-fx-v163')&&!core.includes("stage.appendChild(overlay)"),'old overlay Canvas implementation remains retired');
          ok(!runtime.includes('class-combat-fx-v163.js'),'runtime does not load quarantined combat FX follower');
          console.log(`\nRESULT  ${pass} passed / ${fail} failed`); process.exit(fail?1:0);
          EOF
          node test/class-combat-fx-authority-v131.cjs
          bash ops/check-authority-local.sh
      - name: Remove one-shot workflow and commit recovery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/recover-class-combat-fx-v131-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/core/game.js test/class-combat-fx-authority-v131.cjs .github/workflows/recover-class-combat-fx-v131-once.yml
          git commit -m "art: recover class combat FX in canonical renderer"
          git push origin HEAD:feature/recover-class-combat-fx-v131
