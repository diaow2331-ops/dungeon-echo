name: Build release bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-bundles.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Focused release validation
        run: |
          node --check content-system.js
          node --check progression-system.js
          node test/guardian-content.cjs
          node test/skill-evolution.cjs
          node test/production.cjs
          node test/descent100.cjs
          node test/release.cjs

      - name: Build game bundle
        run: bash ops/release/build-site-bundle.sh "$GITHUB_WORKSPACE/91hwl-play-dungeon-echo-v$(cat VERSION).zip"

      - name: Build homepage bundle
        run: bash ops/release/build-home-mount-bundle.sh "$GITHUB_WORKSPACE/91hwl-home-dungeon-echo-v$(cat VERSION).zip"

      - name: Upload release bundles
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-echo-v1.1.0-release-bundles
          path: |
            91hwl-play-dungeon-echo-v1.1.0.zip
            91hwl-home-dungeon-echo-v1.1.0.zip
          if-no-files-found: error
          retention-days: 14
