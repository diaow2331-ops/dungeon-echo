name: combat-critical-cutover-once-v130

on:
  push:
    branches:
      - refactor/critical-multiplier-v130
    paths:
      - .github/workflows/combat-critical-cutover-once-v130.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/critical-multiplier-v130
          fetch-depth: 0

      - name: Apply exact critical multiplier transfer
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('.github/combat-critical-cutover-once.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  <script src=\\"', '<script src=\\"')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile .github/combat-critical-cutover-once.py
          python .github/combat-critical-cutover-once.py
          node --check game/core/game.js

      - name: Verify formula parity and governance
        run: |
          node <<'NODE'
          const rules = require('./game/domain/combat/combat-rules-v130.js');
          if (rules.authority !== 'critical-damage-multiplier') throw new Error('wrong combat authority');
          let samples = 0;
          for (const p of [0, 1, 5, 10, 25, 50, 75, 100, 150, 250, 500]) {
            const oldValue = 1.8 + p / 100;
            const newValue = rules.criticalMultiplier(p);
            if (Math.abs(oldValue - newValue) > 1e-12) throw new Error(`parity failed ${p}: ${oldValue} != ${newValue}`);
            samples++;
          }
          console.log(`critical_multiplier_parity=PASS samples=${samples}`);
          NODE
          node test/combat-rules-v130.cjs
          node test/entry-authority-v130.cjs
          node test/single-authority-v130.cjs
          bash ops/check-authority-local.sh

      - name: Commit cutover and remove one-shot executor
        run: |
          rm -f .github/combat-critical-cutover-once.py .github/workflows/combat-critical-cutover-once-v130.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: transfer critical-damage multiplier authority'
          git push origin HEAD:refactor/critical-multiplier-v130
