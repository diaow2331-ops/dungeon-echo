name: equipment-stat-authority-hardening-once-v130

on:
  push:
    branches:
      - refactor/narrow-equipment-stat-authority-v130

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Narrow authority and future-proof completed audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, before, after, count=None):
              p = Path(path)
              s = p.read_text()
              n = s.count(before)
              if count is not None and n != count:
                  raise SystemExit(f'{path}: expected {count} matches for {before!r}, found {n}')
              if n == 0:
                  raise SystemExit(f'{path}: missing {before!r}')
              p.write_text(s.replace(before, after))

          # Production contract: only the canonical equipment score is authoritative.
          rep('game/domain/inventory/equipment-rules-v130.js', 'production inventory-derived-rules authority', 'production equipment-stat-scoring authority', 1)
          rep('game/domain/inventory/equipment-rules-v130.js', "authority:'inventory-derived-rules'", "authority:'equipment-stat-scoring'", 1)
          rep('game/domain/inventory/equipment-rules-v130.js', 'itemStatScore', 'equipmentStatScore')

          rep('game/core/game.js', '由唯一 inventory-derived-rules 权威提供', '由唯一 equipment-stat-scoring 权威提供', 1)
          rep('game/core/game.js', "INVENTORY_RULES.authority !== 'inventory-derived-rules'", "INVENTORY_RULES.authority !== 'equipment-stat-scoring'", 1)
          rep('game/core/game.js', 'Dungeon Echo inventory-derived-rules authority missing', 'Dungeon Echo equipment-stat-scoring authority missing', 1)
          rep('game/core/game.js', 'INVENTORY_RULES.itemStatScore(stats)', 'INVENTORY_RULES.equipmentStatScore(stats)', 1)

          rep('docs/authority-map-v130.json', '"inventoryDerivedRules":', '"equipmentStatScoring":', 1)
          rep('docs/ARCHITECTURE_SINGLE_AUTHORITY.md',
              '| Inventory derived rules | `game/domain/inventory/equipment-rules-v130.js` | supply deterministic item/equipment calculations to core | mutate bag/equipment/player state, consume RNG, price or commit economy transactions |',
              '| Equipment stat scoring | `game/domain/inventory/equipment-rules-v130.js` | return the canonical deterministic equipment stat score to core | mutate bag/equipment/player state, consume RNG, generate loot, alter class-fit/rarity/depth rules, or price economy transactions |', 1)
          rep('docs/ARCHITECTURE_SINGLE_AUTHORITY.md',
              'Content classification and inventory derived rules have completed their atomic authority transfers and are now active production.',
              'Content classification and equipment stat scoring have completed their atomic authority transfers and are now active production.', 1)

          rep('test/inventory-rules-v130.cjs', "rules.authority, 'inventory-derived-rules'", "rules.authority, 'equipment-stat-scoring'", 1)
          rep('test/inventory-rules-v130.cjs', 'rules.itemStatScore', 'rules.equipmentStatScore')
          rep('test/single-authority-v130.cjs', 'authority.authorities.inventoryDerivedRules', 'authority.authorities.equipmentStatScoring', 1)
          rep('test/inventory-authority-cutover-tool-v130.cjs', "INVENTORY_RULES.authority !== 'inventory-derived-rules'", "INVENTORY_RULES.authority !== 'equipment-stat-scoring'", 1)

          # Keep the reusable migration audit aligned with the narrowed responsibility.
          p = Path('ops/inventory-authority-cutover-v130.cjs')
          s = p.read_text()
          replacements = [
              ('production inventory-derived-rules authority', 'production equipment-stat-scoring authority'),
              ("authority:'inventory-derived-rules'", "authority:'equipment-stat-scoring'"),
              ("INVENTORY_RULES.authority !== 'inventory-derived-rules'", "INVENTORY_RULES.authority !== 'equipment-stat-scoring'"),
              ('Dungeon Echo inventory-derived-rules authority missing', 'Dungeon Echo equipment-stat-scoring authority missing'),
              ('inventoryDerivedRules', 'equipmentStatScoring'),
              ('Inventory derived rules', 'Equipment stat scoring'),
              ('inventory derived rules', 'equipment stat scoring'),
              ('itemStatScore', 'equipmentStatScore'),
          ]
          for before, after in replacements:
              if before not in s:
                  raise SystemExit(f'cutover tool missing marker: {before}')
              s = s.replace(before, after)

          anchor = '''function stage(rel, fn) {
            const before = read(rel);
            const after = fn(before);
            return { rel, before, after, changed: after !== before };
          }

          '''
          completed = '''function completedInventoryCutover() {
            const map = JSON.parse(read('docs/authority-map-v130.json'));
            if (!map.authorities || map.authorities.equipmentStatScoring !== 'game/domain/inventory/equipment-rules-v130.js') return false;
            if (map.stagedPureLibraries && map.stagedPureLibraries.inventoryRules) return false;
            const moduleSource = read('game/domain/inventory/equipment-rules-v130.js');
            if (!moduleSource.includes("authority:'equipment-stat-scoring'")) return false;
            const game = read('game/core/game.js');
            if (!game.includes("const INVENTORY_RULES = typeof window !== 'undefined' ? window.DE_INVENTORY_RULES_V130 : null")) return false;
            if (!game.includes('const eqScoreOf = stats => INVENTORY_RULES.equipmentStatScore(stats);')) return false;
            const inventoryScript = 'game/domain/inventory/equipment-rules-v130.js?v=169';
            const coreScript = 'game/core/game.js?v=169';
            for (const rel of ['index.html', 'en/index.html']) {
              const html = read(rel);
              if (!html.includes(inventoryScript) || !html.includes(coreScript) || html.indexOf(inventoryScript) >= html.indexOf(coreScript)) return false;
            }
            const manifest = read('ops/release/static-files.txt').split(/\\r?\\n/).filter(Boolean);
            return manifest.includes('game/domain/inventory/equipment-rules-v130.js');
          }

          if (completedInventoryCutover()) {
            console.log(APPLY ? 'inventory_authority_cutover=PASS changed=0' : 'inventory_authority_cutover_preflight=PASS files=10 would_change=0');
            process.exit(0);
          }

          '''
          if 'function completedInventoryCutover()' in s:
              raise SystemExit('completed inventory audit already exists')
          if anchor not in s:
              raise SystemExit('cutover tool stage anchor missing')
          p.write_text(s.replace(anchor, anchor + completed, 1))
          PY
      - name: Verify behavior and full governance gate
        shell: bash
        run: |
          set -euo pipefail
          node --check game/core/game.js
          node --check ops/inventory-authority-cutover-v130.cjs
          node test/inventory-authority-cutover-tool-v130.cjs
          node - <<'NODE'
          const assert = require('assert');
          const rules = require('./game/domain/inventory/equipment-rules-v130.js');
          const old = s => Math.round((s.atk || 0) * 3 + (s.def || 0) * 3 + (s.hp || 0) * .6 +
            (s.crit || 0) * 1.5 + (s.leech || 0) * 1.2 + (s.gold || 0) * .15 +
            (s.thorns || 0) * 2 + (s.regen || 0) * 1);
          assert.equal(rules.authority, 'equipment-stat-scoring');
          for (let i = 0; i < 250; i++) {
            const s = { atk:i%31, def:i%19, hp:(i*7)%113, crit:i%17, leech:i%13, gold:i%29, thorns:i%11, regen:i%9 };
            assert.equal(rules.equipmentStatScore(s), old(s));
          }
          console.log('equipment_stat_score_parity=PASS samples=250');
          NODE
          bash ops/check-authority-local.sh
      - name: Commit and remove one-shot executor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/equipment-stat-authority-hardening-once-v130.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No hardening changes produced" >&2; exit 1; }
          git commit -m "refactor: narrow inventory authority to equipment stat scoring"
          git push origin HEAD:refactor/narrow-equipment-stat-authority-v130
