name: release-governance

# Release-candidate pull requests run only focused production contracts.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify single-authority v1.3.0 runtime
        run: node test/single-authority-v130.cjs
      - name: Verify retained expedition pressure
        run: node test/expedition-pressure-v1211.cjs
      - name: Verify combat controls remain intact
        run: node test/combat-controls-v1.cjs
      - name: Build immutable Dungeon Echo v1.3.0 ZIP
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ops/release/build-site-bundle.sh "$RUNNER_TEMP/91hwl-play-dungeon-echo-v1.3.0.zip"
      - name: Upload Dungeon Echo v1.3.0 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-echo-v1.3.0-single-authority
          path: ${{ runner.temp }}/91hwl-play-dungeon-echo-v1.3.0.zip
          if-no-files-found: error
          retention-days: 7
