name: release-governance

# Release-candidate pull requests run only the focused high-value contracts needed
# to build an immutable Dungeon Echo artifact. Routine pushes remain unscheduled.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify retained expedition pressure
        run: node test/expedition-pressure-v1211.cjs
      - name: Verify v1.2 release freeze
        run: node test/release-freeze-v1.2.cjs
      - name: Verify site deploy version boundary
        run: node test/site-bundle-version-contract.cjs
      - name: Verify complete v1.2.12 art artifact
        run: node test/release-v1212-art.cjs
      - name: Verify 91hwl project-page version alignment
        run: node test/home-mount.cjs
      - name: Build immutable Dungeon hot-update ZIP
        run: bash ops/release/build-site-bundle.sh "$RUNNER_TEMP/91hwl-play-dungeon-echo-v1.2.12.zip"
      - name: Upload Dungeon hot-update ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-echo-v1.2.12-hot-update
          path: ${{ runner.temp }}/91hwl-play-dungeon-echo-v1.2.12.zip
          if-no-files-found: error
          retention-days: 7
