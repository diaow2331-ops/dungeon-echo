name: release-governance

on:
  pull_request:
    branches: [main]
    paths:
      - VERSION
      - index.html
      - en/index.html
      - README.md
      - game/core/runtime-bootstrap.js
      - game/core/release-stamp-*.js
      - game/ui/equipment-shop-ui.js
      - game/ui/expedition-pressure-v1211.js
      - docs/releases/**
      - ops/release/**
      - ops/site-bundle/**
      - ops/home-mount/**
      - test/expedition-pressure-v1211.cjs
      - test/home-mount.cjs
      - test/release.cjs
      - test/release-freeze-v1.2.cjs
      - .github/workflows/release-governance.yml
  push:
    branches: [main]
    paths:
      - VERSION
      - index.html
      - en/index.html
      - README.md
      - game/core/runtime-bootstrap.js
      - game/core/release-stamp-*.js
      - game/ui/equipment-shop-ui.js
      - game/ui/expedition-pressure-v1211.js
      - docs/releases/**
      - ops/release/**
      - ops/site-bundle/**
      - ops/home-mount/**
      - test/expedition-pressure-v1211.cjs
      - test/home-mount.cjs
      - test/release.cjs
      - test/release-freeze-v1.2.cjs
      - .github/workflows/release-governance.yml

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.2.11 expedition pressure
        run: node test/expedition-pressure-v1211.cjs
      - name: Verify release freeze
        run: node test/release-freeze-v1.2.cjs
      - name: Verify immutable Dungeon bundle
        run: node test/release.cjs
      - name: Verify 91hwl trust surfaces
        run: node test/home-mount.cjs
      - name: Verify immutable public release ZIP
        run: bash ops/release/build-public-release-zip.sh "$RUNNER_TEMP/91hwl-public-release.zip"
