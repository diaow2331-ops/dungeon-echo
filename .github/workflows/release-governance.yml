name: release-governance

# Automatic GitHub Actions triggers are intentionally paused while the monthly
# Actions quota is exhausted. Run manually only when quota is available again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.2.11 expedition pressure
        run: node test/expedition-pressure-v1211.cjs
      - name: Verify release freeze
        run: node test/release-freeze-v1.2.cjs
      - name: Verify immutable Dungeon bundle
        run: node test/release.cjs
      - name: Verify 91hwl trust surfaces
        run: node test/home-mount.cjs
      - name: Verify immutable public release ZIP
        run: bash ops/release/build-public-release-zip.sh "$RUNNER_TEMP/91hwl-public-release.zip"
