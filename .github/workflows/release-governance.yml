name: release-governance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  authority-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify single-authority topology
        run: node test/single-authority-v130.cjs
      - name: Verify production entry authority
        run: node test/entry-authority-v130.cjs
      - name: Build immutable Dungeon Echo v1.3.0 baseline ZIP
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ops/release/build-site-bundle.sh "$RUNNER_TEMP/91hwl-play-dungeon-echo-v1.3.0.zip"
      - name: Upload authority-baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-echo-v1.3.0-authority-baseline-169
          path: ${{ runner.temp }}/91hwl-play-dungeon-echo-v1.3.0.zip
          if-no-files-found: error
          retention-days: 7
