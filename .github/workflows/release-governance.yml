name: release-governance

on:
  pull_request:
    branches: [main]
    paths:
      - VERSION
      - index.html
      - en/index.html
      - README.md
      - game/core/runtime-bootstrap.js
      - game/core/release-stamp-*.js
      - docs/releases/**
      - ops/home-mount/**
      - ops/release/**
      - ops/site-bundle/**
      - test/home-mount.cjs
      - test/release.cjs
      - test/release-freeze-v1.2.cjs
      - .github/workflows/release-governance.yml
  push:
    branches: [main]
    paths:
      - VERSION
      - index.html
      - en/index.html
      - README.md
      - game/core/runtime-bootstrap.js
      - game/core/release-stamp-*.js
      - docs/releases/**
      - ops/home-mount/**
      - ops/release/**
      - ops/site-bundle/**
      - test/home-mount.cjs
      - test/release.cjs
      - test/release-freeze-v1.2.cjs
      - .github/workflows/release-governance.yml

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release freeze
        run: node test/release-freeze-v1.2.cjs
      - name: Verify immutable Dungeon bundle
        run: node test/release.cjs
      - name: Verify 91hwl home mount
        run: node test/home-mount.cjs
      - name: Build 91hwl immutable site artifact
        if: github.event_name == 'push'
        run: bash ops/release/build-home-mount-bundle.sh 91hwl-home-web-toys-v1.3.4.zip
      - name: Upload 91hwl immutable site artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: 91hwl-home-web-toys-v1.3.4
          path: 91hwl-home-web-toys-v1.3.4.zip
          if-no-files-found: error
          retention-days: 7
