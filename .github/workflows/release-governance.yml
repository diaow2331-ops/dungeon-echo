name: release-governance

# Automatic GitHub Actions triggers are intentionally paused while the monthly
# Actions quota is exhausted. Run manually only when quota is available again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify retained v1.2.11 expedition pressure
        run: node test/expedition-pressure-v1211.cjs
      - name: Verify unified boss and guardian art
        run: node test/art-runtime-v3-bosses.cjs
      - name: Verify terrain art v4
        run: node test/art-runtime-v4.cjs
      - name: Verify town art v160
        run: node test/town-art-v160.cjs
      - name: Verify four-class combat FX
        run: node test/class-combat-fx-v163.cjs
      - name: Verify four-direction hero art
        run: node test/hero-directional-art-v165.cjs
      - name: Verify release freeze
        run: node test/release-freeze-v1.2.cjs
      - name: Verify site deploy release boundary
        run: node test/site-bundle-version-contract.cjs
      - name: Verify offline public release boundary
        run: node test/dual-public-release.cjs
      - name: Verify immutable Dungeon bundle
        run: node test/release.cjs
      - name: Verify 91hwl trust surfaces
        run: node test/home-mount.cjs
      - name: Verify immutable public release ZIP
        run: bash ops/release/build-public-release-zip.sh "$RUNNER_TEMP/91hwl-public-release.zip"
