name: format-town-market-v131-once
on:
  push:
    branches: [feature/recover-town-market-v131]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-town-market-v131
          fetch-depth: 0
      - name: Normalize Town market indentation and revalidate
        shell: bash
        run: |
          set -euo pipefail
          python -B <<'PY'
          from pathlib import Path
          p=Path('game/core/game.js')
          s=p.read_text()
          start=s.index("  const shopEl = $('town-shop');")
          end=s.index("  if (wheelEl) {", start)
          block=s[start:end]
          assert "\nif (shopEl) {" in block and "\nconst wheelEl = $('town-wheel');" in block, 'expected unindented candidate block not found'
          lines=block.splitlines()
          fixed=[]
          for i,line in enumerate(lines):
            if i == 0:
              fixed.append(line)
            elif line.startswith('if (shopEl) {') or line.startswith('const wheelEl ='):
              fixed.append('  '+line)
            else:
              fixed.append('  '+line if line else line)
          new='\n'.join(fixed)
          if block.endswith('\n'): new+='\n'
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
          git rm .github/workflows/format-town-market-v131-once.yml
          git add game/core/game.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+diaow2331-ops@users.noreply.github.com'
          git commit -m 'style: align Town market render block'
          node test/commerce-event-locale-v130.cjs
          node test/guardian-content.cjs
          node test/skill-evolution.cjs
          node --check game/core/game.js
          bash ops/check-authority-local.sh
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "game/core/game.js test/commerce-event-locale-v130.cjs "
          git push origin HEAD:feature/recover-town-market-v131
