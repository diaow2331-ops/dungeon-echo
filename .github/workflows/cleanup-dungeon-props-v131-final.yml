name: cleanup-dungeon-props-v131-final
on:
  push:
    branches: ["feature/recover-dungeon-props-v131"]
    paths: [".github/workflows/cleanup-dungeon-props-v131-final.yml"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-dungeon-props-v131
          fetch-depth: 0
      - name: Finalize formatting
        shell: bash
        run: |
          set -euo pipefail
          python -B <<'PY'
          from pathlib import Path
          p=Path('game/core/game.js'); s=p.read_text()
          cask=(
            "    if (it.type === 'cask') {\n"
            "      const by = it.y * TILE + TILE / 2 + bob * 0.6;\n"
            "      if (!drawDungeonProp(DUNGEON_PROP_ART.woodBarrel, px, by, 28, 28, .96)) {\n"
            "        ctx.fillStyle = '#6b4a2e'; ctx.fillRect(px - 9, by - 8, 18, 14);\n"
            "        ctx.fillStyle = '#4a301c'; ctx.fillRect(px - 9, by - 5, 18, 3); ctx.fillRect(px - 9, by + 3, 18, 3);\n"
            "        ctx.fillStyle = '#8a6a44'; ctx.beginPath(); ctx.ellipse(px, by - 8, 9, 3, 0, Math.PI, 0); ctx.fill();\n"
            "      }\n"
            "      continue;\n"
            "    }\n"
          )
          start=s.index("    if (it.type === 'cask') {")
          end=s.index("    if (it.type === 'equip') {", start)
          s=s[:start]+cask+s[end:]
          chest=(
            "    if (it.type === 'chest') {\n"
            "      if (!drawDungeonProp(DUNGEON_PROP_ART.treasureChest, px, py, 30, 28, .98) && spr)\n"
            "        ctx.drawImage(spr.img, px - 12, py - 12, 24, 24);\n"
            "    } else if (!drawLootIcon(iconId, px, py, 24) && spr) {\n"
            "      ctx.drawImage(spr.img, px - 11, py - 11, 22, 22);\n"
            "    }\n"
          )
          start=s.index("    if (it.type === 'chest') {", end)
          stop=s.index("  }\n\n  for (const m of monsters) {", start)
          s=s[:start]+chest+s[stop:]
          p.write_text(s)
          PY
          git rm .github/workflows/cleanup-dungeon-props-v131-final.yml
          git add game/core/game.js
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: finalize dungeon prop renderer formatting'
          node --check game/core/game.js
          node test/dungeon-props-authority-v131.cjs
          bash ops/check-authority-local.sh
          git push origin HEAD:feature/recover-dungeon-props-v131
