name: locale-cache-contract-once-v169

on:
  push:
    branches:
      - test/locale-cache-v169-contract
    paths:
      - .github/workflows/locale-cache-contract-once-v169.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/locale-cache-v169-contract
          fetch-depth: 0
      - name: Run current locale and cache contracts
        run: |
          node test/fixed-locale-routes-v131.cjs
          node test/cache-bust-v140.cjs
          node test/core-locale-data-v139.cjs
          node test/game-core-locale-v140.cjs
          bash ops/check-authority-local.sh
      - name: Remove one-shot workflow and commit validation cleanup
        run: |
          rm -f .github/workflows/locale-cache-contract-once-v169.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: validate v169 locale cache contracts'
          git push origin HEAD:test/locale-cache-v169-contract
