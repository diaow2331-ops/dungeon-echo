name: Apply Golden 20 build traits

on:
  push:
    branches:
      - opt/golden20-build-traits

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opt/golden20-build-traits
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply focused build-trait patch
        run: node scripts/apply-golden20-build-traits.cjs

      - name: Syntax
        run: |
          node --check game.js
          node --check test/smoke.cjs
          git diff --check

      - name: Deterministic regression
        run: |
          node test/smoke.cjs
          node test/descent100.cjs

      - name: Commit verified patch and remove migration scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-golden20-build-traits.cjs .github/workflows/apply-golden20-build-traits.yml
          git add game.js test/smoke.cjs
          git commit -m 'feat: add build-defining epic and legendary traits'
          git push origin HEAD:opt/golden20-build-traits
