name: inventory-authority-cutover-once-v130

on:
  push:
    branches:
      - refactor/inventory-derived-authority-v130

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair literal template markers and syntax-check cutover tool
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ops/inventory-authority-cutover-v130.cjs')
          s = p.read_text()
          replacements = {
              '${entry}: staged inventory rules must not be loaded in production': r'\${entry}: staged inventory rules must not be loaded in production',
              '${rel}?v=169': r'\${rel}?v=169',
              '${entry}: production inventory rules must be loaded': r'\${entry}: production inventory rules must be loaded',
              '${entry}: inventory authority must load before core': r'\${entry}: inventory authority must load before core',
          }
          for before, after in replacements.items():
              if before not in s:
                  raise SystemExit(f'missing expected template marker: {before}')
              s = s.replace(before, after)
          p.write_text(s)
          PY
          node --check ops/inventory-authority-cutover-v130.cjs
          node --check test/inventory-authority-cutover-tool-v130.cjs
      - name: Keep completed Content cutover audit resilient to later modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ops/content-authority-cutover-v130.cjs')
          s = p.read_text()
          old = """function stage(rel, fn) {
            const before = read(rel);
            const after = fn(before);
            return { rel, before, after, changed: after !== before };
          }

          const results = [];
          """
          new = """function stage(rel, fn) {
            const before = read(rel);
            const after = fn(before);
            return { rel, before, after, changed: after !== before };
          }

          function completedContentCutover() {
            const map = JSON.parse(read('docs/authority-map-v130.json'));
            if (!map.authorities || map.authorities.contentClassification !== 'game/domain/content/content-rules-v130.js') return false;
            const moduleSource = read('game/domain/content/content-rules-v130.js');
            if (!moduleSource.includes(\"authority: 'content-classification'\")) return false;
            const game = read('game/core/game.js');
            if (!game.includes(\"const CONTENT_RULES = typeof window !== 'undefined' ? window.DE_CONTENT_RULES_V130 : null\")) return false;
            const contentScript = 'game/domain/content/content-rules-v130.js?v=169';
            const coreScript = 'game/core/game.js?v=169';
            for (const rel of ['index.html', 'en/index.html']) {
              const html = read(rel);
              if (!html.includes(contentScript) || !html.includes(coreScript) || html.indexOf(contentScript) >= html.indexOf(coreScript)) return false;
            }
            const manifest = read('ops/release/static-files.txt').split(/\\r?\\n/).filter(Boolean);
            return manifest.includes('game/domain/content/content-rules-v130.js');
          }

          if (completedContentCutover()) {
            console.log(APPLY ? 'content_authority_cutover=PASS changed=0' : 'content_authority_cutover_preflight=PASS files=10 would_change=0');
            process.exit(0);
          }

          const results = [];
          """
          if old not in s:
              raise SystemExit('content cutover insertion anchor not found')
          p.write_text(s.replace(old, new))
          PY
          node --check ops/content-authority-cutover-v130.cjs
      - name: Preflight atomic inventory authority transfer
        run: node ops/inventory-authority-cutover-v130.cjs --check
      - name: Apply atomic inventory authority transfer
        run: node ops/inventory-authority-cutover-v130.cjs --apply
      - name: Verify score formula parity
        shell: bash
        run: |
          node - <<'NODE'
          const assert = require('assert');
          const rules = require('./game/domain/inventory/equipment-rules-v130.js');
          const old = s => Math.round((s.atk || 0) * 3 + (s.def || 0) * 3 + (s.hp || 0) * .6 +
            (s.crit || 0) * 1.5 + (s.leech || 0) * 1.2 + (s.gold || 0) * .15 +
            (s.thorns || 0) * 2 + (s.regen || 0) * 1);
          for (let i = 0; i < 250; i++) {
            const s = { atk:i%31, def:i%19, hp:(i*7)%113, crit:i%17, leech:i%13, gold:i%29, thorns:i%11, regen:i%9 };
            assert.equal(rules.itemStatScore(s), old(s));
          }
          console.log('inventory_score_parity=PASS samples=250');
          NODE
      - name: Verify repository authority gate
        shell: bash
        run: |
          node --check game/core/game.js
          bash ops/check-authority-local.sh
      - name: Commit cutover and remove one-shot executor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/inventory-authority-cutover-once-v130.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No inventory cutover changes produced" >&2; exit 1; }
          git commit -m "refactor: transfer inventory derived-rule authority"
          git push origin HEAD:refactor/inventory-derived-authority-v130
