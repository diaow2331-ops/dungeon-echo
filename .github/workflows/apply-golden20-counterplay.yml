name: Apply Golden 20 counterplay

on:
  push:
    branches:
      - opt/golden20-p0-counterplay

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opt/golden20-p0-counterplay
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply focused combat patch
        run: node scripts/apply-golden20-counterplay.cjs

      - name: Syntax
        run: |
          node --check game.js
          node --check content-system.js
          node --check equipment-system.js
          node --check test/smoke.cjs
          git diff --check

      - name: Deterministic regression
        run: |
          node test/smoke.cjs
          node test/descent100.cjs

      - name: Commit verified patch and remove migration scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-golden20-counterplay.cjs .github/workflows/apply-golden20-counterplay.yml
          git add game.js content-system.js equipment-system.js test/smoke.cjs
          git commit -m 'fix: replace hidden armor pierce with telegraphed counterplay'
          git push origin HEAD:opt/golden20-p0-counterplay
