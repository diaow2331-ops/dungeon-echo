name: Import Dungeon Echo migration bundle

on:
  push:
    branches:
      - migration/from-dragon-workshop
    paths:
      - .github/workflows/import-migration.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/from-dragon-workshop
          fetch-depth: 0
      - name: Download and unpack exact source bundle
        shell: bash
        env:
          BUNDLE_URL: "https://raw.githubusercontent.com/diaow2331-ops/dragon-workshop/feature/dungeon-roguelike/games/dungeon-roguelike/.migration-bundle.b64?token=B4YG3RDESPZZQLC5RK3GKPTKRTXEFAA"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$BUNDLE_URL" -o /tmp/dungeon-echo.b64
          base64 --decode /tmp/dungeon-echo.b64 > /tmp/dungeon-echo.tgz
          mkdir -p /tmp/dungeon-echo-unpack
          tar -xzf /tmp/dungeon-echo.tgz -C /tmp/dungeon-echo-unpack
          rsync -a /tmp/dungeon-echo-unpack/games/dungeon-roguelike/ ./
      - name: Verify migration payload
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f game.js
          test -f style.css
          test -f profiles/classic-100.profile.js
          test -f art/loot-atlas.png
          test "$(git hash-object game.js)" = "92c419694105669271da9998e910da30592ef996"
          test "$(git hash-object art/loot-atlas.png)" = "6bd789973c3cf6391b4cf0e95c111b972607455c"
          test "$(git hash-object profiles/classic-100.profile.js)" = "dd671d95d259fd285db9b01fc531c352d525969d"
      - name: Commit migrated game and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-migration.yml
          git add -A
          git commit -m "chore: migrate Dungeon Echo from dragon-workshop@1871683"
          git push origin HEAD:migration/from-dragon-workshop
