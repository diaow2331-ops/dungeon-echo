name: recover-town-checkpoints-v131-once
on:
  push:
    branches: ["feature/recover-town-checkpoints-v131"]
    paths: [".github/workflows/recover-town-checkpoints-v131-once.yml"]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-town-checkpoints-v131
          fetch-depth: 0
      - name: Recover checkpoints inside canonical core town authority
        shell: bash
        run: |
          set -euo pipefail
          python -B <<'PY'
          from pathlib import Path

          # ---- core gameplay/UI ownership ----
          p=Path('game/core/game.js'); s=p.read_text()
          marker="// ================= 贪婪远征：城镇 / 回城 / 元进度 =================\n"
          block=(
            "const TOWN_CHECKPOINTS = Object.freeze([1, 11, 21, 31, 41, 51, 61, 71, 81, 91]);\n"
            "let selectedTownCheckpoint = 1;\n"
            "function unlockedTownCheckpoints() {\n"
            "  const best = Math.max(0, Math.floor(Number(meta && meta.bestDepth) || 0));\n"
            "  return TOWN_CHECKPOINTS.filter(d => d === 1 || best >= d);\n"
            "}\n"
            "function selectTownCheckpoint(target) {\n"
            "  if (state !== 'town' || !meta) return false;\n"
            "  const depth = Math.max(1, Math.floor(Number(target) || 1));\n"
            "  if (!unlockedTownCheckpoints().includes(depth)) return false;\n"
            "  selectedTownCheckpoint = depth;\n"
            "  renderTown();\n"
            "  return true;\n"
            "}\n"
            "function renderTownCheckpoints() {\n"
            "  const panel = $('town-checkpoints');\n"
            "  if (!panel || !meta) return;\n"
            "  const unlocked = unlockedTownCheckpoints();\n"
            "  if (!unlocked.includes(selectedTownCheckpoint)) selectedTownCheckpoint = 1;\n"
            "  const best = Math.max(0, Math.floor(Number(meta.bestDepth) || 0));\n"
            "  panel.innerHTML =\n"
            "    `<div class=\"checkpoint-head\"><b>${ui('已征服段首','Conquered Checkpoints')}</b>` +\n"
            "    `<small>${ui(`最深 ${best} 层 · 到达新段首后即可从小镇重返`, `Deepest Floor ${best} · reached segment starts become departure points`)}</small></div>` +\n"
            "    `<div class=\"checkpoint-grid\">${TOWN_CHECKPOINTS.map(d => {` +\n"
            "      `const open = unlocked.includes(d); const active = open && d === selectedTownCheckpoint;` +\n"
            "      `return `<button type=\"button\" data-checkpoint=\"${d}\" class=\"${active ? 'active' : ''}${open ? '' : ' locked'}\"` +` +\n"
            "        ` aria-pressed=\"${active ? 'true' : 'false'}\"${open ? '' : ' disabled aria-disabled=\"true\"'}` +\n"
            "        ` title=\"${open ? ui(`从第 ${d} 层出发`, `Depart for Floor ${d}`) : ui(`尚未到达第 ${d} 层`, `Floor ${d} not reached yet`)}\">` +\n"
            "        `${ui(`第 ${d} 层`, `Floor ${d}`)}</button>`;` +\n"
            "    `}).join('')}</div>`;\n"
            "  const depart = $('btn-depart');\n"
            "  if (depart) depart.textContent = selectedTownCheckpoint === 1\n"
            "    ? ui('从第 1 层出发', 'Depart for Floor 1')\n"
            "    : ui(`从已征服区 · 第 ${selectedTownCheckpoint} 层出发`, `Depart from conquered ground · Floor ${selectedTownCheckpoint}`);\n"
            "}\n"
          )
          if s.count(marker)!=1: raise SystemExit('greedy town marker mismatch')
          s=s.replace(marker,marker+block,1)

          render_anchor="""  const itemTag = it => {
          """
          if s.count(render_anchor)!=1: raise SystemExit('renderTown item anchor mismatch')
          s=s.replace(render_anchor,"  renderTownCheckpoints();\n"+render_anchor,1)

          old="function departTown() {\n  if (!greedyMode || !meta) return;\n  buildSprites();\n  depth = 1; turns = 0; state = 'playing';\n"
          new=(
            "function departTown(targetDepth = selectedTownCheckpoint) {\n"
            "  if (!greedyMode || !meta) return;\n"
            "  const unlocked = unlockedTownCheckpoints();\n"
            "  const requested = Math.max(1, Math.floor(Number(targetDepth) || 1));\n"
            "  const startDepth = unlocked.includes(requested) ? requested : 1;\n"
            "  selectedTownCheckpoint = startDepth;\n"
            "  buildSprites();\n"
            "  depth = startDepth; turns = 0; state = 'playing';\n"
          )
          if s.count(old)!=1: raise SystemExit('departTown start anchor mismatch')
          s=s.replace(old,new,1)

          old_msg="  msg(ui(`第 ${meta.runs} 次下潜：搜刮战利品，用回城卷轴（T）把一切平安带回小镇——死在这里就会失去背包和金币！`, `Descent ${meta.runs}: loot what you can, then use Return Scroll (T) to bring it safely back to town — dying here loses your backpack and carried Gold!`), 'gold');\n"
          new_msg="  msg(ui(`第 ${meta.runs} 次下潜：从第 ${startDepth} 层出发。搜刮战利品，用回城卷轴（T）把一切平安带回小镇——死在这里就会失去背包和金币！`, `Descent ${meta.runs}: departing from Floor ${startDepth}. Loot what you can, then use Return Scroll (T) to bring it safely back to town — dying here loses your backpack and carried Gold!`), 'gold');\n"
          if s.count(old_msg)!=1: raise SystemExit('depart message anchor mismatch')
          s=s.replace(old_msg,new_msg,1)

          click_anchor="if ($('town-screen')) $('town-screen').addEventListener('click', e => {\n"
          click_add=(
            "  const checkpoint = e.target.closest('[data-checkpoint]');\n"
            "  if (checkpoint) { ensureAudio(); selectTownCheckpoint(+checkpoint.dataset.checkpoint); return; }\n"
          )
          if s.count(click_anchor)!=1: raise SystemExit('town click anchor mismatch')
          s=s.replace(click_anchor,click_anchor+click_add,1)

          api_anchor="    useEscape, departTown, depositStash, withdrawStash, buyTown,\n"
          api_new=(
            "    useEscape, departTown, depositStash, withdrawStash, buyTown,\n"
            "    unlockedTownCheckpoints, selectTownCheckpoint, get selectedTownCheckpoint() { return selectedTownCheckpoint; },\n"
          )
          if s.count(api_anchor)!=1: raise SystemExit('DE_TEST town api anchor mismatch')
          s=s.replace(api_anchor,api_new,1)
          p.write_text(s)

          # ---- fixed route markup/copy ----
          for rel in ['index.html','en/index.html']:
            p=Path(rel); h=p.read_text()
            anchor='      <div id="town-growth" class="town-growth" aria-live="polite"></div>\n      <div class="town-cols">\n'
            insert='      <div id="town-growth" class="town-growth" aria-live="polite"></div>\n      <div id="town-checkpoints" class="checkpoint-panel" aria-live="polite"></div>\n      <div class="town-cols">\n'
            if h.count(anchor)!=1: raise SystemExit(f'{rel}: town checkpoint markup anchor mismatch')
            h=h.replace(anchor,insert,1)
            if rel=='index.html':
              old='          <p>所有角色都从第 1 层出发。每 10 层是一个关键守卫节点，第 100 层是正式终局；短档位只存在于内部测试，不属于游客玩法。</p>'
              new='          <p>首次远征从第 1 层出发。到达 11/21/…/91 段首并把进度带回小镇后，可从已征服段首再次出发。每 10 层是一个关键守卫节点，第 100 层是正式终局。</p>'
            else:
              old='          <p>Every character starts on Floor 1. Each tenth floor is a major guardian checkpoint and Floor 100 is the production finale; shorter profiles exist only for internal testing.</p>'
              new='          <p>Your first expedition starts on Floor 1. After reaching segment starts 11/21/…/91 and bringing that progress back to town, you can depart from conquered segment starts. Each tenth floor is a major guardian checkpoint; Floor 100 is the production finale.</p>'
            if h.count(old)!=1: raise SystemExit(f'{rel}: help copy anchor mismatch')
            p.write_text(h.replace(old,new,1))

          # ---- town workspace styling ----
          p=Path('style.css'); css=p.read_text()
          marker='.town-growth .town-readiness.warn b { color: #efa26d; }\n'
          add=(
            ".checkpoint-panel { margin: 0 0 12px; padding: 10px 11px; text-align: left; background: rgba(13,9,8,.74); border: 1px solid rgba(139,104,53,.42); }\n"
            ".checkpoint-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }\n"
            ".checkpoint-head b { color: #ead8bb; font-size: 12px; }\n"
            ".checkpoint-head small { color: var(--dim); font-size: 11px; }\n"
            ".checkpoint-grid { display: flex; flex-wrap: wrap; gap: 7px; }\n"
            ".checkpoint-grid button { min-width: 72px; padding: 5px 9px; font-size: 12px; }\n"
            ".checkpoint-grid button.active { border-color: var(--accent-hi); color: var(--accent-hi); box-shadow: inset 0 0 0 1px rgba(242,210,123,.18); }\n"
            ".checkpoint-grid button.locked { opacity: .38; cursor: not-allowed; }\n"
            "@media (max-width: 700px) { .checkpoint-head { align-items: flex-start; flex-direction: column; gap: 3px; } .checkpoint-grid button { min-width: calc(50% - 4px); } }\n"
          )
          if css.count(marker)!=1: raise SystemExit('checkpoint style anchor mismatch')
          p.write_text(css.replace(marker,marker+add,1))
          PY

          cat > test/town-checkpoint-recovery-v131.cjs <<'EOF'
          'use strict';
          const fs=require('fs'),path=require('path'),assert=require('assert');
          const root=path.resolve(__dirname,'..'),read=p=>fs.readFileSync(path.join(root,p),'utf8');
          const core=read('game/core/game.js'),zh=read('index.html'),en=read('en/index.html'),css=read('style.css');
          const staged=require(path.join(root,'game/domain/town/town-rules-v130.js'));
          assert.deepEqual([...staged.CHECKPOINTS],[1,11,21,31,41,51,61,71,81,91],'recovered core uses reviewed checkpoint segment model');
          assert(core.includes('const TOWN_CHECKPOINTS = Object.freeze([1, 11, 21, 31, 41, 51, 61, 71, 81, 91]);'));
          assert(core.includes("return TOWN_CHECKPOINTS.filter(d => d === 1 || best >= d);"),'unlock depends only on actually reached bestDepth');
          assert(core.includes("if (!unlockedTownCheckpoints().includes(depth)) return false;"),'forged/locked selection is rejected');
          assert(core.includes('function departTown(targetDepth = selectedTownCheckpoint)'));
          assert(core.includes('const startDepth = unlocked.includes(requested) ? requested : 1;'),'depart validates again and falls back to Floor 1');
          assert(core.includes('depth = startDepth; turns = 0; state = \'playing\';'),'selected checkpoint becomes actual generated floor');
          assert(core.includes("e.target.closest('[data-checkpoint]')"),'existing core town event owner handles checkpoint buttons');
          assert(!core.includes('localStorage.setItem(\'de-town-checkpoint')&&!core.includes('meta.selectedTownCheckpoint'),'checkpoint selection remains transient, no schema/storage key');
          for(const [route,html] of [['zh',zh],['en',en]]) {
            assert.equal((html.match(/id="town-checkpoints"/g)||[]).length,1,`${route}: exactly one checkpoint panel`);
            assert(!html.includes('game/domain/town/town-rules-v130.js'),`${route}: staged town rules remain unshipped`);
            assert(!html.includes('town-system.js'),`${route}: archived town system remains unshipped`);
          }
          assert(!zh.includes('所有角色都从第 1 层出发。'),'zh stale always-Floor-1 help removed');
          assert(!en.includes('Every character starts on Floor 1.'),'en stale always-Floor-1 help removed');
          assert(en.includes('Your first expedition starts on Floor 1.'),'en checkpoint help is fixed-route English');
          assert(css.includes('.checkpoint-panel')&&css.includes('.checkpoint-grid button.active')&&css.includes('.checkpoint-grid button.locked'),'checkpoint UI is bounded in existing town workspace');
          console.log('town_checkpoint_recovery_v131=PASS');
          EOF

          git rm .github/workflows/recover-town-checkpoints-v131-once.yml
          git add game/core/game.js index.html en/index.html style.css test/town-checkpoint-recovery-v131.cjs
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: restore conquered-depth town departures'

          node test/town-checkpoint-recovery-v131.cjs
          node --check game/core/game.js
          node test/fixed-locale-routes-v131.cjs
          node test/game-core-locale-v140.cjs
          node test/cache-bust-v140.cjs
          bash ops/check-authority-local.sh
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "en/index.html game/core/game.js index.html style.css test/town-checkpoint-recovery-v131.cjs "
          git push origin HEAD:feature/recover-town-checkpoints-v131
