name: recover-town-market-v131-once
on:
  push:
    branches: [feature/recover-town-market-v131]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-town-market-v131
          fetch-depth: 0
      - name: Recover finite town market in canonical core
        shell: bash
        run: |
          set -euo pipefail
          python -B <<'PY'
          from pathlib import Path
          import re
          p=Path('game/core/game.js')
          s=p.read_text()

          a='    wheelSpins: 0, wheelResets: 0, wheelSlots: null,\n    equip: { weapon: null, armor: null, ring: null },'
          b='    wheelSpins: 0, wheelResets: 0, wheelSlots: null,\n    market: null,\n    equip: { weapon: null, armor: null, ring: null },'
          assert s.count(a)==1, 'default meta anchor drifted'
          s=s.replace(a,b,1)

          a="  base.wheelSlots = (Array.isArray(raw.wheelSlots) && raw.wheelSlots.length === WHEEL_SLOTS &&\n    raw.wheelSlots.every(s => s && typeof s === 'object' && !Array.isArray(s) && typeof s.kind === 'string'))\n    ? raw.wheelSlots : null;\n  base.totalKills = num(raw.totalKills, 0);"
          b="  base.wheelSlots = (Array.isArray(raw.wheelSlots) && raw.wheelSlots.length === WHEEL_SLOTS &&\n    raw.wheelSlots.every(s => s && typeof s === 'object' && !Array.isArray(s) && typeof s.kind === 'string'))\n    ? raw.wheelSlots : null;\n  const market = raw.market;\n  const marketStock = market && market.stock;\n  const marketIds = ['potion', 'scroll', 'escape', 'key', 'insurance'];\n  if (market && market.v === 1 && Number.isInteger(market.cycleRun) && market.cycleRun >= 0 &&\n      Number.isInteger(market.tier) && market.tier >= 1 && market.tier <= 10 &&\n      marketStock && typeof marketStock === 'object' &&\n      marketIds.every(id => Number.isInteger(marketStock[id]) && marketStock[id] >= 0 && marketStock[id] <= 99)) {\n    base.market = { v: 1, cycleRun: market.cycleRun, tier: market.tier, stock: { ...marketStock } };\n  }\n  base.totalKills = num(raw.totalKills, 0);"
          assert s.count(a)==1, 'sanitize market anchor drifted'
          s=s.replace(a,b,1)

          marker='const TOWN_CHECKPOINTS = Object.freeze([1, 11, 21, 31, 41, 51, 61, 71, 81, 91]);'
          assert s.count(marker)==1, 'town checkpoint marker drifted'
          market=r'''const TOWN_MARKET_SUPPLIES = Object.freeze({
            potion: { zh:'治疗药水', en:'Healing Potion', base:SHOP.potionPrice || 16,
              stock:tier => 4 + Math.floor((tier - 1) / 3), held:m => m.potions || 0,
              apply:m => { m.potions = (m.potions || 0) + 1; } },
            scroll: { zh:'传送卷轴', en:'Teleport Scroll', base:SHOP.scrollPrice || 28,
              stock:tier => 2 + Math.floor((tier - 1) / 4), held:m => m.scrolls || 0,
              apply:m => { m.scrolls = (m.scrolls || 0) + 1; } },
            escape: { zh:'回城卷轴', en:'Return Scroll', base:SHOP.escapePrice || 26,
              stock:tier => tier >= 5 ? 2 : 1, held:m => m.escapes || 0,
              apply:m => { m.escapes = (m.escapes || 0) + 1; } },
            key: { zh:'锈蚀钥匙', en:'Rusty Key', base:SHOP.keyPrice || 22,
              stock:tier => 2 + (tier >= 4 ? 1 : 0) + (tier >= 8 ? 1 : 0), held:m => m.keys || 0,
              apply:m => { m.keys = (m.keys || 0) + 1; } },
            insurance: { zh:'保险符', en:'Insurance Charm', base:SHOP.insurancePrice || 120,
              stock:() => 1, held:m => m.insurance || 0,
              apply:m => { m.insurance = (m.insurance || 0) + 1; } },
          });
          const TOWN_MARKET_IDS = Object.freeze(Object.keys(TOWN_MARKET_SUPPLIES));
          function townMarketPriceScale(tier) {
            const t = clamp(Math.floor(Number(tier) || 1), 1, 10) - 1;
            return 1 + .42 * t + .065 * t * t;
          }
          function townMarketPrice(id, tier) {
            const def = TOWN_MARKET_SUPPLIES[id];
            if (!def) return 0;
            return Math.max(5, Math.round((def.base * townMarketPriceScale(tier)) / 5) * 5);
          }
          function freshTownMarket(tier = townTierForArt()) {
            const stock = {};
            for (const id of TOWN_MARKET_IDS) stock[id] = Math.max(0, Math.floor(TOWN_MARKET_SUPPLIES[id].stock(tier)));
            return { v:1, cycleRun:Math.max(0, Math.floor(Number(meta && meta.runs) || 0)), tier, stock };
          }
          function validTownMarket(row) {
            return !!(row && row.v === 1 && Number.isInteger(row.cycleRun) && row.cycleRun >= 0 &&
              Number.isInteger(row.tier) && row.tier >= 1 && row.tier <= 10 && row.stock &&
              TOWN_MARKET_IDS.every(id => Number.isInteger(row.stock[id]) && row.stock[id] >= 0 && row.stock[id] <= 99));
          }
          function ensureTownMarket() {
            if (!meta) return null;
            const cycleRun = Math.max(0, Math.floor(Number(meta.runs) || 0));
            const tier = townTierForArt();
            if (!validTownMarket(meta.market) || meta.market.cycleRun !== cycleRun || meta.market.tier !== tier) {
              meta.market = freshTownMarket(tier);
              saveMeta();
            }
            return meta.market;
          }
          '''
          s=s.replace(marker,market+marker,1)

          pat=re.compile(r"  const shopEl = \$\('town-shop'\);\n  if \(shopEl\) shopEl\.innerHTML = \[.*?\n  const wheelEl = \$\('town-wheel'\);",re.S)
          repl=r'''  const shopEl = $('town-shop');
          if (shopEl) {
            const market = ensureTownMarket();
            shopEl.innerHTML = market ? TOWN_MARKET_IDS.map(id => {
              const def = TOWN_MARKET_SUPPLIES[id];
              const price = townMarketPrice(id, market.tier);
              const left = market.stock[id] || 0;
              const held = def.held(meta);
              const label = ui(def.zh, def.en);
              return `<div class="shop-row" data-town-supply="${id}"><span>${esc(label)} ×1 <small>${ui(`持有 ${held} · 库存 ${left}`, `Held ${held} · Stock ${left}`)}</small></span>` +
                `<b>${price} G</b><button type="button" data-townbuy="${id}"${left <= 0 || meta.gold < price ? ' disabled' : ''}>${left > 0 ? ui('购买','Buy') : ui('售罄','Sold out')}</button></div>`;
            }).join('') + `<p class="dim-note">${ui(`城镇阶段 ${market.tier} · 本轮库存固定；开启下一次远征后刷新。`, `Town Tier ${market.tier} · Stock is fixed for this expedition cycle and refreshes after the next expedition begins.`)}</p>` : '';
          }
          const wheelEl = $('town-wheel');'''
          s,n=pat.subn(repl,s,count=1)
          assert n==1, 'town shop render block drifted'

          start=s.index('function buyTown(id) {')
          nxt=re.search(r'\nfunction [A-Za-z_$][\w$]*\(',s[start+1:])
          assert nxt, 'next top-level function after buyTown missing'
          end=start+1+nxt.start()+1
          old=s[start:end]
          assert 'meta.gold -= price;' in old and "id === 'potion'" in old, 'buyTown body drifted'
          new=r'''function buyTown(id) {
            if (state !== 'town' || !meta) return false;
            const market = ensureTownMarket();
            const def = TOWN_MARKET_SUPPLIES[id];
            if (!market || !def) return false;
            const left = Math.max(0, Number(market.stock[id]) || 0);
            const price = townMarketPrice(id, market.tier);
            if (left <= 0) {
              msg(ui(`${def.zh}本轮已经售罄。`, `${def.en} is sold out for this expedition cycle.`), 'bad');
              renderTown();
              return false;
            }
            if (meta.gold < price) {
              msg(ui(`金库金币不足：${def.zh}需要 ${price} G。`, `Not enough vault Gold: ${def.en} costs ${price} G.`), 'bad');
              return false;
            }
            meta.gold -= price;
            def.apply(meta);
            market.stock[id] = left - 1;
            sfx.pickup();
            msg(ui(`购入【${def.zh}】×1。`, `Bought [${def.en}] ×1.`), 'good');
            saveMeta(); renderTown();
            return true;
          }
          '''
          s=s[:start]+new+s[end:]
          p.write_text(s)

          test=r''''use strict';
          const assert=require('assert');
          const fs=require('fs');
          const vm=require('vm');
          const core=fs.readFileSync(require('path').resolve(__dirname,'..','game/core/game.js'),'utf8');
          assert(core.includes('market: null'),'new meta must default market state safely');
          assert(core.includes('const market = raw.market;'),'sanitizer must preserve only validated market state');
          assert(!core.includes("'de-town-commerce-v1'"),'retired commerce sidecar key must stay absent');
          assert(core.includes("scroll: { zh:'传送卷轴', en:'Teleport Scroll'"),'Town market must restore Teleport Scroll');
          assert(core.includes('Held ${held} · Stock ${left}'),'Town market UI must expose stock');

          const a=core.indexOf('const TOWN_MARKET_SUPPLIES =');
          const b=core.indexOf('const TOWN_CHECKPOINTS =',a);
          const c=core.indexOf('function buyTown(id) {');
          const next=core.indexOf('\nfunction ',c+1);
          assert(a>=0&&b>a&&c>b&&next>c,'market executable regions must be discoverable');
          const sb={
            console, Math,
            SHOP:{potionPrice:16,scrollPrice:28,escapePrice:26,keyPrice:22,insurancePrice:120},
            meta:{runs:1,bestDepth:1,gold:10000,potions:0,scrolls:0,escapes:0,keys:0,insurance:0,market:null},
            state:'town',
            clamp:(v,lo,hi)=>Math.max(lo,Math.min(hi,v)),
            townTierForArt(){return Math.max(1,Math.min(10,Math.ceil(Math.max(1,Number(sb.meta.bestDepth)||1)/10)));},
            saveCount:0, saveMeta(){sb.saveCount++;}, renderTown(){},
            ui:(zh,en)=>en, msg(){}, sfx:{pickup(){}},
          };
          vm.createContext(sb);
          vm.runInContext(core.slice(a,b)+core.slice(c,next)+`\n;globalThis.__m={ensureTownMarket,townMarketPrice,buyTown,freshTownMarket};`,sb,{filename:'town-market-core.js'});
          const M=sb.__m;
          let market=M.ensureTownMarket();
          assert.deepEqual(JSON.parse(JSON.stringify(market.stock)),{potion:4,scroll:2,escape:1,key:2,insurance:1},'Tier 1 stock curve mismatch');
          const same=M.ensureTownMarket(); assert.equal(same,market,'reopening Town must not refresh stock');
          const price1=M.townMarketPrice('potion',1); const gold0=sb.meta.gold;
          assert.equal(M.buyTown('potion'),true); assert.equal(market.stock.potion,3); assert.equal(sb.meta.potions,1); assert.equal(sb.meta.gold,gold0-price1);
          M.buyTown('escape'); const afterSold=sb.meta.gold; assert.equal(market.stock.escape,0); assert.equal(M.buyTown('escape'),false); assert.equal(sb.meta.gold,afterSold,'sold-out purchase must not charge Gold');
          sb.meta.runs=2; market=M.ensureTownMarket(); assert.equal(market.cycleRun,2); assert.equal(market.stock.escape,1,'new expedition cycle must refresh stock');
          sb.meta.bestDepth=41; market=M.ensureTownMarket(); assert.equal(market.tier,5); assert.equal(market.stock.escape,2,'Tier 5 must expand Return Scroll stock');
          assert(M.townMarketPrice('potion',5)>price1,'late Town Tier prices must scale upward');
          const persisted=JSON.parse(JSON.stringify(sb.meta)); assert(persisted.market&&persisted.market.stock,'market state must ride existing meta serialization');
          console.log('town_market_core_v131=PASS');
          '''
          Path('test/commerce-event-locale-v130.cjs').write_text(test)
          PY

          git rm .github/workflows/recover-town-market-v131-once.yml
          git add game/core/game.js test/commerce-event-locale-v130.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+diaow2331-ops@users.noreply.github.com'
          git commit -m 'feat: restore finite tier-scaled town market in core'
          node test/commerce-event-locale-v130.cjs
          node test/guardian-content.cjs
          node test/skill-evolution.cjs
          node --check game/core/game.js
          bash ops/check-authority-local.sh
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "game/core/game.js test/commerce-event-locale-v130.cjs "
          git push origin HEAD:feature/recover-town-market-v131
