name: recover-town-npc-art-v131-once
on:
  push:
    branches: ["feature/recover-town-npc-art-v131"]
    paths: [".github/workflows/recover-town-npc-art-v131-once.yml"]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-town-npc-art-v131
          fetch-depth: 0
      - name: Build candidate HEAD and push only after full PASS
        shell: bash
        run: |
          set -euo pipefail
          python -B ops/recovery/promote-town-npc-v131.py
          rm .github/workflows/recover-town-npc-art-v131-once.yml
          rm ops/recovery/promote-town-npc-v131.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/core/game.js art/town-npc-atlas-v1.svg ops/release/static-files.txt test/town-npc-art-authority-v131.cjs .github/workflows/recover-town-npc-art-v131-once.yml ops/recovery/promote-town-npc-v131.py
          git commit -m "art: promote detailed town NPCs into canonical renderer"
          node test/town-npc-art-authority-v131.cjs
          node --check game/core/game.js
          cmp -s art/town-npc-atlas-v1.svg archive/quarantine-v130/art/assets/runtime/hero-action-atlas-v2.svg
          bash ops/check-authority-local.sh
          git push origin HEAD:feature/recover-town-npc-art-v131
