name: recover-skill-evolution-v131-once
on:
  push:
    branches: [feature/recover-skill-evolution-v131]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-skill-evolution-v131
          fetch-depth: 0
      - name: Restore milestone evolution inside canonical core
        shell: bash
        run: |
          set -euo pipefail
          python -B <<'PY'
          from pathlib import Path
          import textwrap

          p=Path('game/core/game.js'); s=p.read_text()
          arch=Path('archive/quarantine-v130/gameplay/progression/progression-system.js').read_text()

          # Reuse only the reviewed data table. No archived runtime/wrapper code is shipped.
          a0=arch.index('  const E = (id, zhName, enName, zhDesc, enDesc) => [')
          a1=arch.index('  const evoTalents = Object.create(null);', a0)
          data=textwrap.dedent(arch[a0:a1])
          data=data.replace('const E = (id, zhName, enName, zhDesc, enDesc)', 'const EVO = (id, zhName, enName, zhDesc, enDesc)', 1)
          data=data.replace("E('", "EVO('")
          data=data.replace('const evolution = {', 'const SKILL_EVOLUTION_ROWS = {', 1)
          support=r'''
          const SKILL_EVOLUTION_MILESTONES = Object.freeze([20, 40, 60, 80]);
          const SKILL_EVOLUTION_TALENTS = Object.freeze(Object.fromEntries(
            Object.entries(SKILL_EVOLUTION_ROWS).flatMap(([cid, milestones]) =>
              Object.entries(milestones).flatMap(([milestone, rows]) => rows.map(([id, name, desc]) => [id, Object.freeze({
                id, name: ui(`${milestone}层 · ${name}`, `Floor ${milestone} · ${name}`), desc, apply() {}, evolution: true, classId: cid, milestone: Number(milestone),
              })]))
            )
          ));
          function skillEvolutionTalent(id) { return SKILL_EVOLUTION_TALENTS[id] || null; }
          function hasSkillEvolution(id) { return !!(player && Array.isArray(player.talents) && player.talents.includes(id)); }
          function pendingSkillEvolution() {
            if (!player) return null;
            const chosen = new Set(player.talents || []);
            for (const milestone of SKILL_EVOLUTION_MILESTONES) {
              if (depth < milestone) break;
              const pair = SKILL_EVOLUTION_ROWS[classId] && SKILL_EVOLUTION_ROWS[classId][milestone];
              if (pair && !pair.some(row => chosen.has(row[0]))) return pair.map(row => skillEvolutionTalent(row[0]));
            }
            return null;
          }
          let skillFollowup = null;
          function skillFollowupPlan(cid, killed) {
            let scale = 0, zh = '', en = '';
            if (cid === 'ranger') {
              if (hasSkillEvolution('se_r60_marksman')) { scale = .35; zh = '拉弦余势'; en = 'Drawstring Momentum'; }
              if (hasSkillEvolution('se_r80_phantom') && scale < .20) { scale = .20; zh = '幻步余势'; en = 'Phantom Momentum'; }
              if (hasSkillEvolution('se_r80_chain') && killed && scale < .25) { scale = .25; zh = '无尽追猎'; en = 'Endless Hunt'; }
            } else if (cid === 'assassin') {
              if (hasSkillEvolution('se_a60_mark')) { scale = .40; zh = '死亡标记'; en = 'Death Mark'; }
              if (hasSkillEvolution('se_a80_predator') && !killed && scale < .25) { scale = .25; zh = '猎物未死'; en = 'Prey Survived'; }
            }
            return scale ? Object.freeze({ scale, zh, en }) : null;
          }
          function consumeSkillFollowup() {
            const plan = skillFollowup;
            if (plan) skillFollowup = null;
            return plan;
          }
          '''
          talent_end='''  { id: 'echoborn', name: '回响体', desc: '自然回复加快：每 4 回合 +1 生命。', apply: p => { p.fastRegen = true; } },
          ];
          '''
          if s.count(talent_end)!=1: raise SystemExit('talent end anchor mismatch')
          s=s.replace(talent_end, talent_end+'\n'+data+'\n'+textwrap.dedent(support)+'\n',1)

          # Follow-up bonuses are consumed in the existing shared core attack paths.
          melee_old="""function playerAttack(m) {
            lunge(player, m.x, m.y);
            let dmg = Math.max(1, pAtk() + ri(-1, 1) - m.def);
            let mult = 1;
          """
          melee_new="""function playerAttack(m) {
            lunge(player, m.x, m.y);
            const skillPlan = consumeSkillFollowup();
            const skillBonus = skillPlan ? Math.max(1, Math.round(pAtk() * skillPlan.scale)) : 0;
            let dmg = Math.max(1, pAtk() + skillBonus + ri(-1, 1) - m.def);
            let mult = 1;
            if (skillPlan) msg(ui(`【${skillPlan.zh}】强化了这次方向攻击。`, `[${skillPlan.en}] empowered this directional attack.`), 'good');
          """
          if s.count(melee_old)!=1: raise SystemExit('playerAttack anchor mismatch')
          s=s.replace(melee_old,melee_new,1)

          ranged_old="""function playerRangedAttack(m) {
            fireArrow(player.x, player.y, m.x, m.y);
            let dmg = Math.max(1, pAtk() + ri(-1, 1) - m.def);
            let mult = 1;
          """
          ranged_new="""function playerRangedAttack(m) {
            fireArrow(player.x, player.y, m.x, m.y);
            const skillPlan = consumeSkillFollowup();
            const skillBonus = skillPlan ? Math.max(1, Math.round(pAtk() * skillPlan.scale)) : 0;
            let dmg = Math.max(1, pAtk() + skillBonus + ri(-1, 1) - m.def);
            let mult = 1;
            if (skillPlan) msg(ui(`【${skillPlan.zh}】强化了这次方向攻击。`, `[${skillPlan.en}] empowered this directional attack.`), 'good');
          """
          if s.count(ranged_old)!=1: raise SystemExit('playerRangedAttack anchor mismatch')
          s=s.replace(ranged_old,ranged_new,1)

          # Keep the established base skill intact, then wrap it inside the same core authority.
          if s.count('function useSkill() {')!=1: raise SystemExit('useSkill anchor mismatch')
          s=s.replace('function useSkill() {','function useBaseSkill() {',1)
          descend='\nfunction descend() {'
          if s.count(descend)!=1: raise SystemExit('descend anchor mismatch')
          wrapper=r'''
          function skillEvolutionVisibleMonsters() {
            return monsters.filter(m => m && m.hp > 0 && visible[m.y] && visible[m.y][m.x])
              .sort((a, b) => (Math.abs(a.x - player.x) + Math.abs(a.y - player.y)) - (Math.abs(b.x - player.x) + Math.abs(b.y - player.y)));
          }
          function skillEvolutionWarriorSplash() {
            const coreAdjacent = monsters.some(m => Math.abs(m.x - player.x) + Math.abs(m.y - player.y) === 1);
            if (!coreAdjacent) return;
            const targets = [];
            if (hasSkillEvolution('se_w20_arc')) for (const m of monsters) if (Math.abs(m.x-player.x)===1 && Math.abs(m.y-player.y)===1) targets.push([m,.65]);
            if (hasSkillEvolution('se_w40_reach')) for (const m of monsters) {
              const dx=Math.abs(m.x-player.x), dy=Math.abs(m.y-player.y);
              if ((dx===2&&dy===0)||(dx===0&&dy===2)) targets.push([m,.70]);
            }
            if (hasSkillEvolution('se_w80_tempest')) for (const m of monsters) {
              const dx=Math.abs(m.x-player.x), dy=Math.abs(m.y-player.y), core=dx+dy===1;
              if (!core && Math.max(dx,dy)<=2 && !targets.some(row=>row[0]===m)) targets.push([m,.72]);
            }
            const base=pAtk();
            for (const [m,scale] of [...targets]) if (m.hp>0 && monsters.includes(m)) applyDamageToMonster(m,Math.max(1,Math.round(base*scale)-(Number(m.def)||0)),false);
          }
          function skillEvolutionMageSplash(vis) {
            const base=pAtk(), rows=[];
            if (hasSkillEvolution('se_m80_storm')) for (const m of vis.slice(1,4)) rows.push([m,.65]);
            else if (hasSkillEvolution('se_m40_chain')) for (const m of vis.slice(1,3)) rows.push([m,.45]);
            else if (hasSkillEvolution('se_m20_fork') && vis[1]) rows.push([vis[1],.55]);
            for (const [m,scale] of rows) if (m && m.hp>0 && monsters.includes(m)) applyDamageToMonster(m,Math.max(1,Math.round(base*scale)-Math.floor((Number(m.def)||0)*.4)),false);
          }
          function useSkill() {
            if (state !== 'playing' || !player) return;
            const cid=classId;
            const hasAny=(player.talents||[]).some(id=>String(id).startsWith(`se_${cid[0]}`));
            if (!hasAny || player.skillCd>0) return useBaseSkill();
            const p=player, beforeTurn=turns, beforeCount=monsters.length, beforeHp=Number(p.hp)||0;
            const originalAtk=Number(p.atkBase)||0, originalDr=Number(p.flatDr)||0, originalHaste=Number(p.skillHaste)||0;
            const visBefore=skillEvolutionVisibleMonsters(), targetBefore=visBefore[0]||null;
            const nearbyBefore=monsters.filter(m=>Math.abs(m.x-p.x)+Math.abs(m.y-p.y)<=2).length;
            let tempAtk=0,tempDr=0,tempHaste=0;
            if (cid==='warrior') {
              skillEvolutionWarriorSplash();
              if (hasSkillEvolution('se_w20_guard')) tempDr+=3;
              if (hasSkillEvolution('se_w80_fortress')) tempDr+=7;
              if (hasSkillEvolution('se_w60_pressure')) tempAtk+=Math.max(2,Math.round(pAtk()*.22));
            } else if (cid==='mage') {
              skillEvolutionMageSplash(visBefore);
              if (hasSkillEvolution('se_m20_barrier')) tempDr+=4;
              if (hasSkillEvolution('se_m40_focus') && visBefore.length===1) tempAtk+=Math.max(2,Math.round(pAtk()*.30));
              if (hasSkillEvolution('se_m80_singularity') && visBefore.length===1) tempAtk+=Math.max(3,Math.round(pAtk()*.45));
            } else if (cid==='ranger') {
              if (hasSkillEvolution('se_r20_evasion')) tempDr+=4;
              if (hasSkillEvolution('se_r80_phantom')) tempDr+=5;
              if (hasSkillEvolution('se_r20_tempo')) tempHaste+=1;
            } else if (cid==='assassin') {
              if (hasSkillEvolution('se_a20_smoke')) tempDr+=4;
              if (hasSkillEvolution('se_a60_escape')) tempDr+=5;
              if (hasSkillEvolution('se_a20_execute') && targetBefore && targetBefore.maxHp && targetBefore.hp<=targetBefore.maxHp*.45) tempAtk+=Math.max(2,Math.round(pAtk()*.35));
            }
            p.atkBase=originalAtk+tempAtk; p.flatDr=originalDr+tempDr; p.skillHaste=originalHaste+tempHaste;
            try { useBaseSkill(); }
            finally { p.atkBase=originalAtk; p.flatDr=originalDr; p.skillHaste=originalHaste; }
            const used=turns>beforeTurn;
            if (!used) return;
            const killed=monsters.length<beforeCount;
            if (cid==='warrior') {
              if (hasSkillEvolution('se_w40_rhythm') && nearbyBefore>=2) p.skillCd=Math.max(0,(p.skillCd||0)-1);
              if (hasSkillEvolution('se_w60_blood') && killed) p.hp=Math.min(pMaxHp(),p.hp+Math.max(2,Math.round(pMaxHp()*.08)));
            } else if (cid==='mage') {
              if (hasSkillEvolution('se_m60_overload') && killed) p.skillCd=Math.max(0,(p.skillCd||0)-2);
              if (hasSkillEvolution('se_m60_repulse') && targetBefore && targetBefore.hp>0 && monsters.includes(targetBefore)) {
                const dx=Math.sign(targetBefore.x-p.x),dy=Math.sign(targetBefore.y-p.y),nx=targetBefore.x+dx,ny=targetBefore.y+dy;
                if (walkable(nx,ny) && !monsterAt(nx,ny) && !npcAt(nx,ny)) { targetBefore.x=nx;targetBefore.y=ny;targetBefore.fx=nx;targetBefore.fy=ny; }
              }
            } else if (cid==='ranger') {
              if ((hasSkillEvolution('se_r80_chain')||hasSkillEvolution('se_r40_hunt')) && killed) p.skillCd=0;
              if (hasSkillEvolution('se_r40_flow') && !killed) p.skillCd=Math.max(0,(p.skillCd||0)-2);
              if (hasSkillEvolution('se_r60_sustain') && killed) p.hp=Math.min(pMaxHp(),p.hp+Math.max(2,Math.round(pMaxHp()*.10)));
            } else if (cid==='assassin') {
              if (hasSkillEvolution('se_a80_chain') && killed) p.skillCd=0;
              else if (hasSkillEvolution('se_a40_tempo') && killed) p.skillCd=Math.max(0,(p.skillCd||0)-2);
              if (hasSkillEvolution('se_a40_blood') && killed) p.hp=Math.min(pMaxHp(),p.hp+Math.max(2,Math.round(pMaxHp()*.12)));
              if (hasSkillEvolution('se_a80_predator') && !killed) p.skillCd=Math.max(0,(p.skillCd||0)-2);
            }
            skillFollowup=skillFollowupPlan(cid,killed);
            if (skillFollowup) msg(ui(`【${skillFollowup.zh}】已蓄势：下一次方向攻击获得强化。`,`[${skillFollowup.en}] is primed: your next directional attack is empowered.`),'good');
            if ((Number(p.hp)||0)>beforeHp) msg(ui('技能进化触发了额外续航。','Skill evolution triggered extra sustain.'),'good');
          }
          '''
          s=s.replace(descend,'\n'+textwrap.dedent(wrapper)+descend,1)

          # Talent delivery: milestone pair takes precedence; otherwise preserve existing 3-random ordinary pool.
          open_old="""  const pool = [...TALENTS];
            const picks = [];
            while (picks.length < 3 && pool.length) {
              picks.push(pool.splice(rnd(pool.length), 1)[0]);
            }
          """
          open_new="""  const evolutionPicks = pendingSkillEvolution();
            const pool = evolutionPicks ? [...evolutionPicks] : [...TALENTS];
            const picks = [];
            if (evolutionPicks) picks.push(...pool);
            else while (picks.length < 3 && pool.length) {
              picks.push(pool.splice(rnd(pool.length), 1)[0]);
            }
          """
          if s.count(open_old)!=1: raise SystemExit('openTalent pool anchor mismatch')
          s=s.replace(open_old,open_new,1)
          pick_old="  const t = TALENTS.find(x => x.id === id);\n"
          pick_new="  const t = TALENTS.find(x => x.id === id) || skillEvolutionTalent(id);\n"
          if s.count(pick_old)!=1: raise SystemExit('pickTalent anchor mismatch')
          s=s.replace(pick_old,pick_new,1)

          # Transient follow-up state must never cross run/town restoration boundaries.
          for old,new in [
            ("function enterTown() {\n", "function enterTown() {\n  skillFollowup = null;\n"),
            ("function newGame(chosen) {\n", "function newGame(chosen) {\n  skillFollowup = null;\n"),
            ("function restoreRun(raw) {\n", "function restoreRun(raw) {\n  skillFollowup = null;\n"),
          ]:
            if s.count(old)==1: s=s.replace(old,new,1)
            elif 'restoreRun' not in old: raise SystemExit(f'transient reset anchor mismatch: {old.strip()}')

          # Fix the stale English launch instruction. Current production contract is C, not legacy K/J.
          stale="`You chose ${c.name}. Press J to attack in your facing direction. Press K to use ${c.skill.name}.` +"
          fresh="`You chose ${c.name}. Press C to use ${c.skill.name}. Move into an enemy to attack.` +"
          if s.count(stale)!=1: raise SystemExit('English launch skill hint anchor mismatch')
          s=s.replace(stale,fresh,1)

          p.write_text(s)
          PY

          cat > test/skill-evolution.cjs <<'EOF'
          'use strict';
          const fs=require('fs'),path=require('path'),assert=require('assert');
          const root=path.resolve(__dirname,'..'),read=p=>fs.readFileSync(path.join(root,p),'utf8');
          const core=read('game/core/game.js'),docs=read('docs/SKILL_EVOLUTION.md');
          assert(!fs.existsSync(path.join(root,'progression-system.js')),'retired root progression wrapper must remain absent');
          assert(core.includes('const SKILL_EVOLUTION_ROWS = {'),'evolution data must live in canonical core');
          assert(core.includes('function pendingSkillEvolution()'),'core must own milestone delivery');
          assert(core.includes('for (const milestone of SKILL_EVOLUTION_MILESTONES)'),'earliest-missing milestone scan required');
          assert(core.includes('const evolutionPicks = pendingSkillEvolution();'),'talent screen must prioritize a pending evolution pair');
          assert(core.includes('if (evolutionPicks) picks.push(...pool);'),'pending milestone must expose exactly its pair, not random ordinary talents');
          assert(core.includes("TALENTS.find(x => x.id === id) || skillEvolutionTalent(id)"),'pickTalent must accept stable evolution ids');
          const ids=[...core.matchAll(/EVO\('(se_[^']+)'/g)].map(m=>m[1]);
          assert.equal(ids.length,32,'must contain 32 reviewed evolution choices');
          assert.equal(new Set(ids).size,32,'all evolution ids must be unique');
          for(const c of ['w','r','m','a']) for(const d of [20,40,60,80])
            assert.equal(ids.filter(id=>id.startsWith(`se_${c}${d}_`)).length,2,`${c} floor ${d} must have exactly two choices`);
          assert(core.includes('function useBaseSkill() {')&&core.includes('function useSkill() {'),'base cast must be wrapped inside core, not an external runtime');
          assert(core.includes('finally { p.atkBase=originalAtk; p.flatDr=originalDr; p.skillHaste=originalHaste; }'),'temporary cast stats must always restore');
          assert(core.includes('let skillFollowup = null;'),'follow-up attack state must be transient module state');
          assert(core.includes('function consumeSkillFollowup()'),'core must own follow-up consumption');
          const melee=core.slice(core.indexOf('function playerAttack('),core.indexOf('function findRangedTarget('));
          const ranged=core.slice(core.indexOf('function playerRangedAttack('),core.indexOf('function monsterAttack('));
          assert(melee.includes('consumeSkillFollowup()')&&ranged.includes('consumeSkillFollowup()'),'melee and ranged shared core paths must consume follow-up');
          assert(!core.includes('window.DE_SKILL_EVOLUTION'),'no old global wrapper API should return');
          assert(!core.includes('Press J to attack in your facing direction. Press K to use'),'legacy English K/J skill hint must be gone');
          assert(core.includes('Press C to use ${c.skill.name}. Move into an enemy to attack.'),'English launch hint must match current C contract');
          assert(docs.includes('`C` hotkey'),'formal skill-evolution docs must match production C input');
          console.log('skill_evolution_core_v131=PASS');
          EOF

          # Core-only source equality check: all reviewed historical evolution IDs survived migration.
          python -B <<'PY'
          import re
          from pathlib import Path
          core=Path('game/core/game.js').read_text(); old=Path('archive/quarantine-v130/gameplay/progression/progression-system.js').read_text()
          a=set(re.findall(r"EVO\('(se_[^']+)'",core)); b=set(re.findall(r"E\('(se_[^']+)'",old))
          if a!=b: raise SystemExit(f'evolution id migration mismatch: missing={sorted(b-a)} extra={sorted(a-b)}')
          print('skill_evolution_id_migration=PASS')
          PY

          git rm .github/workflows/recover-skill-evolution-v131-once.yml
          git add game/core/game.js test/skill-evolution.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: restore milestone skill evolution in core'

          node test/skill-evolution.cjs
          node --check game/core/game.js
          node test/game-core-locale-v140.cjs
          node test/fixed-locale-routes-v131.cjs
          bash ops/check-authority-local.sh
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "game/core/game.js test/skill-evolution.cjs "
          git push origin HEAD:feature/recover-skill-evolution-v131
