name: recover-wheel-lifecycle-v131-once
on:
  push:
    branches: [feature/recover-wheel-lifecycle-v131]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recover-wheel-lifecycle-v131
          fetch-depth: 0
      - name: Recover wheel lifecycle inside canonical core
        shell: bash
        run: |
          set -euo pipefail
          python -B <<'PY'
          from pathlib import Path
          p=Path('game/core/game.js')
          s=p.read_text()

          old="""// 8 个奖品槽在进镇时生成、随元档持久化；抽奖随机开一槽，重置则重摇全部槽位。\n// 抽奖费与重置费都随本轮使用次数递增——金币越滚越贵，纯度极高的回收池。\n// 死亡（含保险符结算）后计数归零、轮盘重摇：死神的怜悯，也防止无限膨胀。\nconst WHEEL_SLOTS = 8;\nconst WHEEL_BASE_SPIN = 40, WHEEL_SPIN_STEP = 20;\nconst WHEEL_BASE_RESET = 60, WHEEL_RESET_STEP = 40;\nconst wheelDepth = () => Math.max(3, meta ? (meta.bestDepth || 0) : 0);\nconst spinCost = () => WHEEL_BASE_SPIN + (meta && meta.wheelSpins || 0) * WHEEL_SPIN_STEP;\nconst resetWheelCost = () => WHEEL_BASE_RESET + (meta && meta.wheelResets || 0) * WHEEL_RESET_STEP;"""
          new="""// 8 个奖品槽随元档持久化；每格最多结算一次，只有付费重置才能换新盘。\n// 抽奖/重置同时按操作次数与城镇阶段递增，死亡不会免费洗盘或清掉成本。\nconst WHEEL_SLOTS = 8;\nconst WHEEL_BASE_SPIN = 40, WHEEL_SPIN_STEP = 20;\nconst WHEEL_BASE_RESET = 60, WHEEL_RESET_STEP = 40;\nconst wheelDepth = () => Math.max(3, meta ? (meta.bestDepth || 0) : 0);\nconst wheelTownTier = () => clamp(Math.ceil(Math.max(1, Number(meta && meta.bestDepth) || 1) / 10), 1, 10);\nconst spinCost = () => WHEEL_BASE_SPIN + (meta && meta.wheelSpins || 0) * WHEEL_SPIN_STEP + wheelTownTier() * 20;\nconst resetWheelCost = () => WHEEL_BASE_RESET + (meta && meta.wheelResets || 0) * WHEEL_RESET_STEP + wheelTownTier() * 45;"""
          assert s.count(old)==1, 'wheel policy header drifted'
          s=s.replace(old,new,1)

          anchor="""const ensureWheel = () => {\n  if (!meta) return;\n  if (!Array.isArray(meta.wheelSlots) || meta.wheelSlots.length !== WHEEL_SLOTS)\n    meta.wheelSlots = rollWheelSlots();\n};\nfunction wheelSlotText(s) {"""
          repl="""const ensureWheel = () => {\n  if (!meta) return;\n  if (!Array.isArray(meta.wheelSlots) || meta.wheelSlots.length !== WHEEL_SLOTS)\n    meta.wheelSlots = rollWheelSlots();\n};\nconst wheelClaimedCount = () => meta && Array.isArray(meta.wheelSlots)\n  ? meta.wheelSlots.reduce((n, slot) => n + (slot && slot.claimed ? 1 : 0), 0) : 0;\nfunction consumeWheelSlot(index) {\n  if (!meta || !Array.isArray(meta.wheelSlots)) return false;\n  const slot = meta.wheelSlots[index];\n  if (!slot || slot.claimed) return false;\n  const prizeKind = String(slot.kind || 'nothing');\n  slot.claimed = true;\n  slot.claimedKind = prizeKind;\n  slot.claimedAtSpin = Number(meta.wheelTotal) || 0;\n  slot.kind = 'nothing';\n  if ('item' in slot) delete slot.item;\n  if ('amount' in slot) delete slot.amount;\n  return true;\n}\nfunction wheelSlotText(s) {\n  if (s && s.claimed) return ui('已领取','Claimed');"""
          assert s.count(anchor)==1, 'ensureWheel anchor drifted'
          s=s.replace(anchor,repl,1)

          start=s.index('function spinWheel() {')
          end=s.index('\nfunction resetWheel() {', start)
          old=s[start:end]
          assert 'applyWheelPrize(prize);' in old and 'meta.wheelSpins++;' in old
          new="""function spinWheel() {\n  if (state !== 'town' || !meta) return false;\n  ensureWheel();\n  if (wheelClaimedCount() >= WHEEL_SLOTS) {\n    msg(ui('这一轮八格都已经领取，先付费重置轮盘。','All eight slots are claimed. Reset the wheel before spinning again.'), 'bad');\n    return false;\n  }\n  const cost = spinCost();\n  if (meta.gold < cost) {\n    msg(ui(`金库金币不够——抽奖需要 ${cost} G。`, `Not enough vault Gold — spinning costs ${cost} G.`), 'bad');\n    return false;\n  }\n  meta.gold -= cost;\n  const idx = rnd(WHEEL_SLOTS);\n  const prize = meta.wheelSlots[idx];\n  meta.wheelSpins++;\n  meta.wheelTotal = (meta.wheelTotal || 0) + 1;\n  sfx.chest();\n  msg(ui(`轮盘停在第 ${idx + 1} 槽——`, `The wheel stops on slot ${idx + 1} —`), 'info');\n  if (prize && !prize.claimed) {\n    applyWheelPrize(prize);\n    consumeWheelSlot(idx);\n  } else {\n    msg(ui('这一格已经领取过，本次不会重复发奖。','This slot was already claimed; it pays nothing again.'), 'bad');\n  }\n  startWheelSpin(idx);\n  saveMeta(); renderTown();\n  return true;\n}"""
          s=s[:start]+new+s[end:]

          # Make reset explicitly return success/failure without changing its paid-reset semantics.
          s=s.replace("function resetWheel() {\n  if (state !== 'town' || !meta) return;","function resetWheel() {\n  if (state !== 'town' || !meta) return false;",1)
          s=s.replace("if (meta.gold < cost) { msg(ui(`金库金币不够——重置轮盘需要 ${cost} G。`, `Not enough vault Gold — resetting costs ${cost} G.`), 'bad'); return; }","if (meta.gold < cost) { msg(ui(`金库金币不够——重置轮盘需要 ${cost} G。`, `Not enough vault Gold — resetting costs ${cost} G.`), 'bad'); return false; }",1)
          anchor="  saveMeta(); renderTown();\n}\n\n// ---- 转盘视图"
          assert s.count(anchor)==1, 'resetWheel tail drifted'
          s=s.replace(anchor,"  saveMeta(); renderTown();\n  return true;\n}\n\n// ---- 转盘视图",1)

          # Claimed sectors stay visibly consumed even while retaining lifecycle metadata.
          s=s.replace("function wheelSlotShort(s) {\n  switch (s.kind) {","function wheelSlotShort(s) {\n  if (s && s.claimed) return ui('已领','Claimed');\n  switch (s.kind) {",1)
          s=s.replace("ctx.fillStyle = SECTOR_COLORS[s.kind] || '#333'; ctx.fill();","ctx.fillStyle = s.claimed ? '#241810' : (SECTOR_COLORS[s.kind] || '#333'); ctx.fill();",1)

          # Town controls surface lifecycle state and stop charging once all eight slots are consumed.
          old="""    const sc = spinCost(), rc = resetWheelCost();\n    wheelEl.innerHTML =\n      '<canvas id=\"wheel-canvas\" width=\"240\" height=\"240\"></canvas>' +\n      `<p class=\"dim-note wheel-hint\">${ui('转盘停在哪格，就开哪格——空门也是命运。','The wheel opens the slot it lands on — Empty is part of the odds.')}</p>` +\n      `<div class=\"row-actions\"><button type=\"button\" data-wheelspin=\"1\"${(meta.gold < sc || wheelBusy) ? ' disabled' : ''}` +\n      ` title=\"${ui(`转动轮盘，下一抽 ${sc} G`, `Spin the wheel for ${sc} G`)}\">${ui(`抽奖 ${sc} G`, `Spin ${sc} G`)}</button>` +"""
          new="""    const sc = spinCost(), rc = resetWheelCost();\n    const claimed = wheelClaimedCount(), exhausted = claimed >= WHEEL_SLOTS;\n    wheelEl.innerHTML =\n      '<canvas id=\"wheel-canvas\" width=\"240\" height=\"240\"></canvas>' +\n      `<p class=\"dim-note wheel-hint\">${ui(`八格每格最多领取一次 · 已领取 ${claimed}/8`, `Each slot pays once · ${claimed}/8 claimed`)}</p>` +\n      `<div class=\"row-actions\"><button type=\"button\" data-wheelspin=\"1\"${(exhausted || meta.gold < sc || wheelBusy) ? ' disabled' : ''}` +\n      ` title=\"${ui(exhausted ? '八格已领完，请先重置轮盘' : `转动轮盘，下一抽 ${sc} G`, exhausted ? 'All slots claimed; reset the wheel first' : `Spin the wheel for ${sc} G`)}\">${exhausted ? ui('本轮已全部领取','All prizes claimed') : ui(`抽奖 ${sc} G`, `Spin ${sc} G`)}</button>` +"""
          assert s.count(old)==1, 'wheel UI block drifted'
          s=s.replace(old,new,1)

          # Death must preserve the established board and escalation counters.
          reset_line='      meta.wheelSpins = 0; meta.wheelResets = 0; meta.wheelSlots = null;\n'
          assert s.count(reset_line)==1, 'insured-death reset count drifted'
          s=s.replace(reset_line,'',1)
          reset_line2='  meta.wheelSpins = 0; meta.wheelResets = 0; meta.wheelSlots = null;\n'
          assert s.count(reset_line2)==1, 'normal-death reset count drifted'
          s=s.replace(reset_line2,'',1)

          p.write_text(s)

          test=r'''\'use strict\';
          const assert=require('assert');
          const fs=require('fs');
          const vm=require('vm');
          const core=fs.readFileSync(require('path').resolve(__dirname,'..','game/core/game.js'),'utf8');
          assert(!core.includes("'de-town-wheel-state-v1'"),'retired wheel shadow sidecar must stay absent');
          assert(!core.includes('meta.wheelSpins = 0; meta.wheelResets = 0; meta.wheelSlots = null;'),'death must not reset wheel lifecycle');
          assert(core.includes("if (s && s.claimed) return ui('已领','Claimed');"),'claimed wheel sectors must be visible');
          assert(core.includes('All prizes claimed'),'exhausted wheel UI contract missing');

          const start=core.indexOf('const WHEEL_SLOTS = 8;');
          const end=core.indexOf('// ---- 转盘视图',start);
          assert(start>=0&&end>start,'wheel executable region must be discoverable');
          const equip={name:'Test Blade',score:9};
          const slots=[{kind:'equip',item:equip},...Array.from({length:7},()=>({kind:'nothing'}))];
          const sb={
            console, Math, BAG_CAP:12,
            meta:{bestDepth:1,gold:1000,wheelSpins:0,wheelResets:0,wheelTotal:0,wheelSlots:slots,bag:[],stash:[],potions:0,scrolls:0,keys:0,escapes:0,insurance:0},
            state:'town',
            clamp:(v,lo,hi)=>Math.max(lo,Math.min(hi,v)),
            ui:(zh,en)=>en, visibleItemName:it=>it.name,
            rng:()=>.99, ri:(a)=>a, genEquip:()=>({name:'Fresh',score:1}), rnd:()=>0,
            msg(){}, sfx:{chest(){},skill(){}}, startWheelSpin(){}, startWheelKick(){}, saveMeta(){}, renderTown(){},
          };
          vm.createContext(sb);
          vm.runInContext(core.slice(start,end)+`\n;globalThis.__w={spinCost,resetWheelCost,wheelClaimedCount,consumeWheelSlot,spinWheel,resetWheel,ensureWheel};`,sb,{filename:'wheel-core.js'});
          const W=sb.__w;
          const tier1Spin=W.spinCost(), tier1Reset=W.resetWheelCost();
          assert.equal(tier1Spin,60,'Tier 1 spin must include reviewed 20G tier surcharge');
          assert.equal(tier1Reset,105,'Tier 1 reset must include reviewed 45G tier surcharge');
          const gold0=sb.meta.gold;
          assert.equal(W.spinWheel(),true); assert.equal(sb.meta.bag.length,1,'first equipment landing must award once');
          assert.equal(sb.meta.wheelSlots[0].claimed,true); assert.equal(sb.meta.wheelSlots[0].kind,'nothing');
          assert(!('item' in sb.meta.wheelSlots[0]),'claimed equipment payload must be consumed');
          const gold1=sb.meta.gold;
          assert.equal(W.spinWheel(),true); assert.equal(sb.meta.bag.length,1,'repeat claimed landing must not duplicate equipment');
          assert(sb.meta.gold<gold1&&gold1<gold0,'repeat claimed landing remains a paid empty result');
          sb.meta.wheelSlots.forEach(s=>{s.claimed=true;s.kind='nothing';delete s.item;delete s.amount;});
          const exhaustedGold=sb.meta.gold;
          assert.equal(W.spinWheel(),false); assert.equal(sb.meta.gold,exhaustedGold,'all-claimed board must block without charging');
          sb.meta.bestDepth=100;
          assert(W.spinCost()>tier1Spin&&W.resetWheelCost()>tier1Reset,'Tier 10 wheel costs must exceed Tier 1 for equal-or-higher counters');
          const beforeReset=sb.meta.gold; const oldBoard=sb.meta.wheelSlots;
          assert.equal(W.resetWheel(),true); assert.notEqual(sb.meta.wheelSlots,oldBoard,'paid reset must replace board');
          assert.equal(sb.meta.wheelResets,1); assert(sb.meta.gold<beforeReset);
          assert.equal(W.wheelClaimedCount(),0,'fresh paid board must have no claimed slots');
          const persisted=JSON.parse(JSON.stringify(sb.meta)); assert(Array.isArray(persisted.wheelSlots)&&persisted.wheelResets===1,'wheel lifecycle must ride existing meta serialization');
          console.log('wheel_lifecycle_core_v131=PASS');
          '''.replace("\\'use strict\\';","'use strict';",1)
          Path('test/wheel-death-reroll.cjs').write_text(test)
          PY
          git rm .github/workflows/recover-wheel-lifecycle-v131-once.yml
          git add game/core/game.js test/wheel-death-reroll.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+diaow2331-ops@users.noreply.github.com'
          git commit -m 'feat: restore bounded fortune wheel lifecycle in core'
          node test/wheel-death-reroll.cjs
          node test/commerce-event-locale-v130.cjs
          node test/guardian-content.cjs
          node test/skill-evolution.cjs
          node --check game/core/game.js
          bash ops/check-authority-local.sh
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "game/core/game.js test/wheel-death-reroll.cjs "
          git push origin HEAD:feature/recover-wheel-lifecycle-v131
