<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <title>Dungeon Echo dedicated Echo Town NPC atlas</title>
  <desc>4x4 vector atlas. Runtime role cells: 0 quartermaster, 1 smith, 4 provisioner, 9 alchemist, 10 oracle, 12 portal warden.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4dde5"/><stop offset=".48" stop-color="#87939f"/><stop offset="1" stop-color="#48515a"/></linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e5b968"/><stop offset="1" stop-color="#7d4b24"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#875936"/><stop offset="1" stop-color="#3b271c"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#71c9b1"/><stop offset="1" stop-color="#285f5d"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bda7ea"/><stop offset="1" stop-color="#4d3c75"/></linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8be6ff"/><stop offset=".55" stop-color="#5f8de7"/><stop offset="1" stop-color="#403a91"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#fff"/><stop offset=".2" stop-color="#b9f5ff"/><stop offset=".6" stop-color="#7e8cff"/><stop offset="1" stop-color="#5b3b88" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <style>
      .o{stroke:#201817;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
      .i{stroke:#3a2b28;stroke-width:.9;stroke-linejoin:round;stroke-linecap:round}
      .eye{fill:#f4d99b;stroke:#271a18;stroke-width:.7}
      .shadow{fill:#050505;opacity:.35}
      .skin{fill:#c99470}
      .skin2{fill:#a76f54}
      .shine{fill:#fff;opacity:.48}
    </style>
  </defs>

  <!-- 0: quartermaster — armored, keys and ledger -->
  <g data-role="quartermaster" transform="translate(0 0)">
    <ellipse class="shadow" cx="24" cy="42" rx="13" ry="3"/>
    <path class="o" fill="#4c3d38" d="M13 42l2-19 9-6 9 6 2 19z"/>
    <path class="o" fill="url(#steel)" d="M14 27l6-6h8l6 6-3 13H17z"/>
    <path class="i" fill="#687681" d="M12 27l5-5 4 5-3 7-6-1zM36 27l-5-5-4 5 3 7 6-1z"/>
    <circle class="o skin" cx="24" cy="14" r="7"/>
    <path class="o" fill="#3b2a25" d="M17 13q1-8 7-8 7 0 8 8l-4-3-3 2-3-2z"/>
    <path class="i" fill="#474f55" d="M17 14h14v4l-3 3h-8l-3-3z"/>
    <rect class="eye" x="20" y="14" width="2" height="1.3" rx=".5"/><rect class="eye" x="26" y="14" width="2" height="1.3" rx=".5"/>
    <rect class="o" fill="#6a432d" x="29" y="28" width="8" height="10" rx="1"/>
    <path class="i" fill="#dbc388" d="M31 30h4v6h-4z"/>
    <circle fill="#d7aa53" stroke="#5b3b20" stroke-width="1" cx="13" cy="36" r="2"/><circle fill="none" stroke="#d7aa53" stroke-width="1.2" cx="10" cy="38" r="2.2"/>
  </g>

  <!-- 1: smith — apron, hammer and ember -->
  <g data-role="smith" transform="translate(48 0)">
    <ellipse class="shadow" cx="24" cy="42" rx="14" ry="3"/>
    <path class="o" fill="#452922" d="M12 42l3-20 9-5 9 5 3 20z"/>
    <path class="o" fill="#6a4330" d="M17 23h14l2 19H15z"/>
    <path class="i" fill="#a96f42" d="M18 25h12l-2 15h-8z"/>
    <path class="o skin2" d="M17 13q0-8 7-8t7 8v5q-1 5-7 5t-7-5z"/>
    <path class="o" fill="#28201e" d="M17 12q1-7 7-7 6 0 8 7l-5-2-3 1-3-1z"/>
    <path class="i" fill="#563629" d="M18 18q6 5 12 0-2 7-6 7t-6-7z"/>
    <rect class="eye" x="20" y="14" width="2" height="1.2"/><rect class="eye" x="26" y="14" width="2" height="1.2"/>
    <path class="o" fill="url(#steel)" d="M34 11l7 2-2 7-7-2z"/>
    <rect class="o" fill="#6b472b" x="29" y="17" width="4" height="21" rx="1" transform="rotate(-18 31 27)"/>
    <circle fill="#ff8a3d" cx="10" cy="34" r="1.3"/><circle fill="#ffc35d" cx="13" cy="30" r="1"/><circle fill="#e65a2f" cx="8" cy="29" r=".8"/>
  </g>

  <!-- 2: smith action variant -->
  <g data-role="smith-action" transform="translate(96 0)">
    <ellipse class="shadow" cx="24" cy="42" rx="13" ry="3"/>
    <path class="o" fill="#543027" d="M13 42l3-20 8-5 9 5 3 20z"/>
    <path class="o" fill="#a36d45" d="M18 23h12l1 19H16z"/>
    <circle class="o skin2" cx="24" cy="14" r="7"/>
    <path class="o" fill="#2c2220" d="M17 12q2-7 7-7 6 0 8 7l-6-2-4 2z"/>
    <path class="o" fill="url(#steel)" d="M31 5l9 1 1 7-10 1z"/>
    <rect class="o" fill="#67442a" x="28" y="10" width="3" height="25" rx="1" transform="rotate(24 30 22)"/>
    <path fill="#ff9a4e" d="M8 36l2-5 2 4 3-7 2 8z"/><path fill="#ffd77a" d="M11 36l2-4 2 4z"/>
  </g>

  <!-- 3: records clerk / quartermaster variant -->
  <g data-role="records-clerk" transform="translate(144 0)">
    <ellipse class="shadow" cx="24" cy="42" rx="12" ry="3"/>
    <path class="o" fill="#42505d" d="M14 42l2-20 8-5 8 5 2 20z"/>
    <circle class="o skin" cx="24" cy="14" r="7"/>
    <path class="o" fill="#38302f" d="M17 12q2-8 8-7 5 0 7 7l-8-2z"/>
    <path class="o" fill="#7a4d30" d="M8 25h13v16H8z"/><path class="i" fill="#e4cf99" d="M10 27h9v12h-9z"/>
    <path class="i" fill="none" d="M12 30h5m-5 3h5m-5 3h4"/>
    <path class="o" fill="#d7aa53" d="M31 25l7 3-5 11-6-3z"/>
  </g>

  <!-- 4: provisioner — hood, satchel, bundles -->
  <g data-role="provisioner" transform="translate(0 48)">
    <ellipse class="shadow" cx="24" cy="42" rx="13" ry="3"/>
    <path class="o" fill="#52633b" d="M12 42l4-21 8-5 9 5 4 21z"/>
    <path class="o" fill="#6d7f49" d="M16 20l8-8 9 9-4 6H19z"/>
    <circle class="o skin" cx="24" cy="15" r="6"/>
    <path class="o" fill="#3d4f30" d="M16 14q2-10 8-10 7 1 10 11l-5-2-5-5-4 5z"/>
    <rect class="eye" x="21" y="15" width="1.7" height="1.2"/><rect class="eye" x="26" y="15" width="1.7" height="1.2"/>
    <path class="o" fill="url(#leather)" d="M29 27h10l-1 12H28z"/><path class="i" fill="none" d="M28 27q3-7 8-8"/>
    <path class="o" fill="#b6423c" d="M8 31q5-4 9 0v7H8z"/><path class="i" fill="#d7bd6c" d="M9 32h7v2H9z"/>
    <circle fill="#e6c86c" cx="11" cy="27" r="2"/><circle fill="#8cc56b" cx="16" cy="28" r="2"/>
  </g>

  <!-- 5: provisioner carrying crate -->
  <g data-role="provisioner-crate" transform="translate(48 48)">
    <ellipse class="shadow" cx="24" cy="42" rx="14" ry="3"/>
    <path class="o" fill="#586842" d="M13 40l3-20 8-5 8 5 3 20z"/>
    <circle class="o skin" cx="24" cy="14" r="6"/>
    <path class="o" fill="#405037" d="M17 13q2-9 7-9 7 1 9 10l-5-3-4-3-4 5z"/>
    <rect class="o" fill="#81542f" x="7" y="27" width="20" height="13" rx="1"/>
    <path class="i" fill="none" d="M7 31h20m-10-4v13"/>
    <path fill="#7fbd62" d="M11 25q3-5 6 0-3 3-6 0z"/><path fill="#cc5f48" d="M18 24q4-5 7 1-4 3-7-1z"/>
  </g>

  <!-- 6: travelling merchant -->
  <g data-role="travelling-merchant" transform="translate(96 48)">
    <ellipse class="shadow" cx="24" cy="42" rx="12" ry="3"/>
    <path class="o" fill="#5d4a36" d="M14 42l2-21 8-5 8 5 2 21z"/>
    <circle class="o skin2" cx="24" cy="14" r="6.5"/>
    <path class="o" fill="#332722" d="M16 12h16l-3-6H19z"/>
    <path class="o" fill="#74543a" d="M31 25h9v15h-9z"/><path class="i" fill="#d6ae5c" d="M33 29h5v5h-5z"/>
    <path class="o" fill="#d5c08c" d="M8 25h9v11H8z"/><path class="i" fill="none" d="M10 28h5m-5 3h4"/>
  </g>

  <!-- 7: town watch -->
  <g data-role="town-watch" transform="translate(144 48)">
    <ellipse class="shadow" cx="24" cy="42" rx="12" ry="3"/>
    <path class="o" fill="#4b4d55" d="M14 42l3-21 7-5 8 5 3 21z"/>
    <path class="o" fill="url(#steel)" d="M17 22h15l-2 15H19z"/>
    <circle class="o skin" cx="24" cy="14" r="6"/>
    <path class="o" fill="#5d6670" d="M16 13q2-9 8-9 7 0 9 9l-5-2-4 3-4-3z"/>
    <rect fill="#d8b45a" x="23" y="22" width="3" height="13"/>
    <path class="o" fill="#6b4c2d" d="M36 8h3v33h-3z"/><path class="o" fill="url(#steel)" d="M33 8l4-7 5 7z"/>
  </g>

  <!-- 8: apothecary apprentice -->
  <g data-role="apothecary-apprentice" transform="translate(0 96)">
    <ellipse class="shadow" cx="24" cy="42" rx="11" ry="3"/>
    <path class="o" fill="#32675e" d="M14 42l3-21 7-5 8 5 3 21z"/>
    <circle class="o skin" cx="24" cy="14" r="6"/>
    <path class="o" fill="#274b49" d="M16 12q3-8 8-8 6 0 9 8l-5-2-4-3-4 4z"/>
    <path class="o" fill="#92e0d0" d="M8 27h7l-1 11H9z"/><path fill="#dffdf6" d="M10 29h3v3h-3z"/>
    <path class="o" fill="#7a5a9a" d="M34 25h6v12h-6z"/>
  </g>

  <!-- 9: alchemist — goggles, teal coat, luminous flask -->
  <g data-role="alchemist" transform="translate(48 96)">
    <ellipse class="shadow" cx="24" cy="42" rx="12" ry="3"/>
    <path class="o" fill="url(#teal)" d="M13 42l4-21 7-5 8 5 4 21z"/>
    <circle class="o skin" cx="24" cy="14" r="6.5"/>
    <path class="o" fill="#314a48" d="M16 12q2-8 8-8 7 0 9 9l-6-3-3 2-4-2z"/>
    <circle fill="#bde8df" stroke="#2b3938" stroke-width="1.3" cx="21" cy="14" r="2.5"/><circle fill="#bde8df" stroke="#2b3938" stroke-width="1.3" cx="27" cy="14" r="2.5"/><path class="i" fill="none" d="M23.5 14h1"/>
    <path class="o" fill="#d7eff0" d="M34 27h7v4l-2 9h-5l-2-9z"/><path fill="#58d3a9" d="M34 32h5l-1 6h-3z"/><circle fill="#a8ffe2" cx="37" cy="29" r="1.2"/>
    <path class="i" fill="#d8d0ac" d="M17 25h9v13h-9z"/><path class="i" fill="none" d="M19 28h5m-5 3h5m-5 3h3"/>
  </g>

  <!-- 10: oracle — layered robes, crescent hood and orb -->
  <g data-role="oracle" transform="translate(96 96)">
    <ellipse class="shadow" cx="24" cy="42" rx="13" ry="3"/>
    <circle fill="url(#orb)" cx="37" cy="15" r="9" filter="url(#softGlow)" opacity=".8"/>
    <path class="o" fill="url(#violet)" d="M11 42l6-23 7-5 8 5 6 23z"/>
    <path class="o" fill="#3e315e" d="M15 13q2-10 9-11 8 2 10 12l-6-4-4 5-5-4z"/>
    <ellipse class="o skin" cx="24" cy="15" rx="5.5" ry="6"/>
    <rect class="eye" x="20.5" y="14" width="1.7" height="1.2"/><rect class="eye" x="26" y="14" width="1.7" height="1.2"/>
    <path fill="#c9b5ff" d="M21 23l3 4 3-4-1 12h-4z"/>
    <path class="o" fill="#66508d" d="M35 14h3v27h-3z"/><circle fill="#d8c7ff" stroke="#5b4382" stroke-width="1.2" cx="36.5" cy="12" r="4"/><circle fill="#fff" cx="35" cy="10.5" r="1"/>
    <path fill="#e7d7ff" d="M16 7q3-6 7-5-2 5 2 8-6 1-9-3z"/>
  </g>

  <!-- 11: oracle ritual variant -->
  <g data-role="oracle-ritual" transform="translate(144 96)">
    <ellipse class="shadow" cx="24" cy="42" rx="13" ry="3"/>
    <circle fill="url(#orb)" cx="24" cy="10" r="12" filter="url(#softGlow)" opacity=".75"/>
    <path class="o" fill="#554377" d="M11 42l6-22 7-5 8 5 6 22z"/>
    <ellipse class="o skin" cx="24" cy="15" rx="5.5" ry="6"/>
    <path class="o" fill="#372950" d="M16 13q2-9 8-10 7 1 10 10l-7-4-3 5-4-4z"/>
    <path class="i" fill="none" stroke="#d7c5ff" d="M8 30q16-11 32 0M11 35q13-8 26 0"/>
    <circle fill="#fff" cx="24" cy="8" r="1.5"/><circle fill="#c5b6ff" cx="18" cy="10" r="1"/><circle fill="#c5b6ff" cx="30" cy="11" r="1"/>
  </g>

  <!-- 12: portal warden — tall dark armor, spear, blue sigil -->
  <g data-role="portal-warden" transform="translate(0 144)">
    <ellipse class="shadow" cx="24" cy="42" rx="13" ry="3"/>
    <circle fill="url(#orb)" cx="24" cy="29" r="13" filter="url(#softGlow)" opacity=".5"/>
    <path class="o" fill="#292947" d="M13 42l3-22 8-5 8 5 4 22z"/>
    <path class="o" fill="#4a5075" d="M17 22h14l-2 16H19z"/>
    <circle class="o skin2" cx="24" cy="13" r="6"/>
    <path class="o" fill="#323652" d="M16 13q1-10 8-10 8 0 9 10l-4-3-5 4-5-4z"/>
    <path class="i" fill="#121628" d="M18 13h12v4l-3 2h-6l-3-2z"/>
    <rect fill="#8eeaff" x="21" y="14" width="2" height="1.3"/><rect fill="#8eeaff" x="26" y="14" width="2" height="1.3"/>
    <path class="o" fill="#37384e" d="M37 7h3v35h-3z"/><path class="o" fill="url(#portal)" d="M33 8l5-8 6 8-6 5z"/>
    <circle fill="none" stroke="#82dfff" stroke-width="1.5" cx="24" cy="30" r="6"/><path fill="none" stroke="#82dfff" stroke-width="1" d="M24 24v12m-6-6h12"/>
  </g>

  <!-- 13: portal technician -->
  <g data-role="portal-technician" transform="translate(48 144)">
    <ellipse class="shadow" cx="24" cy="42" rx="12" ry="3"/>
    <path class="o" fill="#354560" d="M13 42l4-21 7-5 8 5 4 21z"/>
    <circle class="o skin" cx="24" cy="14" r="6"/>
    <path class="o" fill="#262d42" d="M16 12q3-8 8-8 6 0 9 9l-6-3-3 2-4-2z"/>
    <path class="o" fill="#233048" d="M8 26h12v13H8z"/><circle fill="#7de7ff" cx="12" cy="30" r="2"/><path fill="none" stroke="#94efff" stroke-width="1" d="M15 29h3m-3 3h3m-6 3h6"/>
    <path class="o" fill="url(#portal)" d="M34 25l7 5-7 9-5-8z"/>
  </g>

  <!-- 14: innkeeper -->
  <g data-role="innkeeper" transform="translate(96 144)">
    <ellipse class="shadow" cx="24" cy="42" rx="12" ry="3"/>
    <path class="o" fill="#6a4435" d="M13 42l4-21 7-5 8 5 4 21z"/>
    <circle class="o skin" cx="24" cy="14" r="6.5"/>
    <path class="o" fill="#493128" d="M16 12q2-8 8-8 7 0 9 8l-6-2-3 2-4-2z"/>
    <path class="i" fill="#eee2c3" d="M18 23h12l2 17H16z"/>
    <path class="o" fill="#b77b45" d="M34 27h7v10h-7z"/><path fill="#f1c968" d="M35 29h5v5h-5z"/>
    <path class="i" fill="none" d="M20 15q4 3 8 0"/>
  </g>

  <!-- 15: expedition scout -->
  <g data-role="expedition-scout" transform="translate(144 144)">
    <ellipse class="shadow" cx="24" cy="42" rx="12" ry="3"/>
    <path class="o" fill="#3e5a49" d="M13 42l4-21 7-5 8 5 4 21z"/>
    <circle class="o skin2" cx="24" cy="14" r="6"/>
    <path class="o" fill="#2e463a" d="M15 13q3-10 9-10 7 0 10 10l-6-3-4 4-5-4z"/>
    <path class="o" fill="#744d31" d="M31 24h9v16h-9z"/><path class="i" fill="none" d="M35 24v16"/>
    <path class="o" fill="#c6d7c4" d="M8 26h9l-1 12H9z"/><path class="i" fill="none" d="M10 29h5m-5 3h4"/>
    <path class="o" fill="#67503a" d="M6 15h2v26H6z"/><path fill="#d9c08a" d="M4 15l3-6 4 6z"/>
  </g>
</svg>
